# THE AUDITOR'S DECISIONS over the unsafe-boundary inventory, keyed by group patterns (first match
# wins, in this order) and by site id where a single site needs its own answer. Regenerating the
# inventory re-applies this file; a site no rule matches is reported UNCLASSIFIED and the audit's
# completeness claim fails while any is.
#
# Categories (closed): required-caller-enforced, contained-implementation, overly-broad,
# abi-linkage, unclear-defect.

# --- test-only sites, recorded apart from the production view --------------------------------

[[group]]
id = "test-only"
invariant = "Compiled only under `cfg(test)` (the kernel test suite, host tests): not in any shipping row. Recorded so the count is visible, not judged as production."
match = [{ test_only = true }]
category = "contained-implementation"
owner = "tests"
disposition = "keep (test-only)"

# --- the kernel, by trust boundary (M2) -----------------------------------------------------

[[group]]
id = "kernel-usercopy"
invariant = "Every instruction that touches a user address is registered in `.extable` with a fixup; a faulting user page becomes a short count, never a kernel fault. The `unsafe fn` contract is on the KERNEL buffer (readable/writable for `len`), which the syscall layer's fixed-size callers uphold. SMAP is opened only inside `paging::user_access`."
match = [{ file = "src/kernel/arch/*/usercopy.rs" }]
category = "required-caller-enforced"
owner = "kernel/arch"
disposition = "keep"

[[group]]
id = "kernel-syscall-read-user"
invariant = "`read_user<T>` builds a `T` from user bytes with `assume_init`, and now SAYS which types that is sound for: `T: UserPlain`, a sealed marker trait implemented for exactly the three plain-data records it reads (`u64`, `[u8; ENTRY_NAME_LEN]`, `CapTransfer`). The trait is sealed, so the list cannot be extended from outside the syscall module, and it is `unsafe` to implement, so adding one is a deliberate claim about bit patterns. A future `T` with invalid bit patterns is refused at compile time rather than being undefined behaviour with no `unsafe` in sight."
match = [{ file = "src/kernel/syscall/mod.rs", item = "crate::syscall::read_user" }]
category = "required-caller-enforced"
owner = "kernel/syscall"
disposition = "keep: the bound is the contract, and the caller still validates the pointer with `user_buf_ok`"

[[group]]
id = "kernel-syscall-user-pointers"
invariant = "User pointers are validated by `user_buf_ok`/`user_buf_writable` and copied through the faultable usercopy under `user_access`; the raw pointers are the kernel-side buffers of fixed-size ABI records. A short copy is an error, never a success."
match = [{ file = "src/kernel/syscall/**" }]
category = "contained-implementation"
owner = "kernel/syscall"
disposition = "keep"

[[group]]
id = "kernel-arch-paging"
invariant = "Page tables are reached through the physical direct map (`phys_to_virt`); an `unsafe fn` takes a table pointer that its SAFETY line requires to be a valid table at that level, owned by the address space being edited under its lock. TLB and control-register writes are the assembly the hardware requires. Falsified by a mapping visible after unmap (the shootdown tests) or a table freed while referenced (frame accounting tests)."
match = [{ file = "src/kernel/arch/*/paging.rs", kind = ["unsafe-fn"] }]
category = "required-caller-enforced"
owner = "kernel/arch"
disposition = "keep"

[[group]]
id = "kernel-arch-paging-internals"
invariant = "The blocks, raw pointers and assembly inside the page-table code: table walks over tables the caller vouched for, `invlpg`/`tlbi`/`sfence.vma`, and control-register reads. Contained behind the safe map/unmap API."
match = [{ file = "src/kernel/arch/*/paging.rs" }]
category = "contained-implementation"
owner = "kernel/arch"
disposition = "keep"

[[group]]
id = "kernel-arch-usermode-and-context"
invariant = "Ring transitions and context switches: `global_asm!` entry/exit stubs, `switch_context`, `write_cr3`/TTBR/SATP writes and the user-mode entry. Their contracts are the calling convention and the saved-frame layout the assembly defines; `enter` requires user-mapped entry and stack addresses that the loader established."
match = [
	{ file = "src/kernel/arch/*/context.rs" },
	{ file = "src/kernel/arch/*/usermode.rs" },
	{ file = "src/kernel/arch/*/exceptions.rs" },
	{ file = "src/kernel/arch/*/traps/**" },
	{ file = "src/kernel/arch/*/syscall_entry.rs" },
	{ file = "src/kernel/arch/*/entry.rs" },
]
category = "required-caller-enforced"
owner = "kernel/arch"
disposition = "keep"

[[group]]
id = "kernel-arch-interrupt-controllers"
invariant = "MMIO to the interrupt controllers (LAPIC/IOAPIC, GIC/ITS, IMSIC/APLIC) at addresses from the device tree or firmware tables, volatile and behind the controller's own lock; the IDT/vector tables are `static mut` written before interrupts are enabled and read-only afterwards."
match = [
	{ file = "src/kernel/arch/*/gic.rs" },
	{ file = "src/kernel/arch/*/its.rs" },
	{ file = "src/kernel/arch/*/imsic.rs" },
	{ file = "src/kernel/arch/*/aplic.rs" },
	{ file = "src/kernel/arch/*/apic.rs" },
	{ file = "src/kernel/arch/*/idt/**" },
	{ file = "src/kernel/arch/*/interrupts/**" },
	{ file = "src/kernel/arch/*/msi.rs" },
	{ file = "src/kernel/arch/*/ioapic.rs" },
	{ file = "src/kernel/arch/*/gicv2m.rs" },
	{ file = "src/kernel/arch/*/timer.rs" },
	{ file = "src/kernel/arch/*/plic.rs" },
]
category = "contained-implementation"
owner = "kernel/arch"
disposition = "keep"

[[group]]
id = "kernel-arch-percpu-and-smp"
invariant = "Per-CPU blocks are leaked once at boot, indexed by a CPU number below the online count the census established (the 64-CPU portable cap and the backend caps); the `unsafe impl Sync` on trap-stack pools holds because each CPU touches only its own slot. AP bring-up writes trampolines and stacks the BSP owns until the AP reports in. Falsified by a CPU index at or past the count, which the census refuses."
match = [
	{ file = "src/kernel/arch/*/percpu.rs" },
	{ file = "src/kernel/smp/**" },
	{ file = "src/kernel/arch/*/apboot.rs" },
	{ file = "src/kernel/arch/*/psci.rs" },
	{ file = "src/kernel/arch/*/smp.rs" },
	{ file = "src/kernel/arch/x86_64/gdt.rs" },
	{ file = "src/kernel/arch/*/cpu.rs" },
]
category = "contained-implementation"
owner = "kernel/smp"
disposition = "keep"

[[group]]
id = "kernel-arch-early-virtio-blk-aarch64"
invariant = "The AArch64 bring-up block driver programs PHYSICAL queue and buffer addresses into the device and enables bus mastering before the IOMMU and the device manager exist: untranslated DMA by construction, inside the ports' produced `no-iommu` mode. Not an unsoundness of the Rust code - the frames are its own - but the boundary P02M0173 M3 requires to move behind confirmed IOMMU initialisation or off the enforcing path."
match = [{ file = "src/kernel/arch/aarch64/virtio_blk.rs" }]
category = "contained-implementation"
owner = "kernel/arch/aarch64"
disposition = "family work: P02M0173 M3 (the early bootstrap access)"

[[group]]
id = "kernel-arch-boot"
invariant = "Early boot before the allocator: BootInfo and firmware-handed memory read at the addresses the loader (or the device tree) gave, single-threaded on the boot CPU, `static mut` probes written once. Contained: nothing after `main` reaches these paths."
match = [
	{ file = "src/kernel/arch/*/boot.rs" },
	{ file = "src/kernel/arch/*/mod.rs" },
	{ file = "src/kernel/arch/*/early.rs" },
	{ file = "src/kernel/arch/*/serial.rs" },
	{ file = "src/kernel/arch/*/uart.rs" },
]
category = "contained-implementation"
owner = "kernel/arch"
disposition = "keep"

[[group]]
id = "kernel-arch-port-io-and-fwcfg"
invariant = "x86_64 port I/O (`in`/`out`) to fixed legacy ports and the `fw_cfg` selector/data ports: the `unsafe fn` says which port is being driven and the callers are the kernel's own console, PCI configuration and the harness carrier read."
match = [
	{ file = "src/kernel/arch/x86_64/port.rs" },
	{ file = "src/kernel/arch/x86_64/fwcfg.rs" },
	{ file = "src/kernel/arch/*/pci.rs" },
]
category = "required-caller-enforced"
owner = "kernel/arch/x86_64"
disposition = "keep"

[[group]]
id = "kernel-dtb-parsing"
invariant = "The device tree is parsed at a physical address the loader handed over; `Fdt::new` requires a valid tree there (its SAFETY contract) and every read inside is bounds-checked against the header's declared sizes (`Bounds`, `be32_in`, `prop_in`). Shared with the loader and host-tested in the `fdt` crate."
match = [{ file = "src/kernel/arch/*/dtb.rs" }, { file = "src/fdt/**" }]
category = "required-caller-enforced"
owner = "fdt"
disposition = "keep"

[[group]]
id = "kernel-iommu"
invariant = "The virtio-IOMMU backend's request/event queues and DMA scratch live in frames the module owns and pins; every access carries a SAFETY line naming the frame and the bound; MMIO is to the controller's own configuration structures resolved from its PCI capabilities. Falsified by the hostile EDU gate and the fault-drain tests."
match = [{ file = "src/kernel/iommu/**" }]
category = "contained-implementation"
owner = "kernel/iommu"
disposition = "keep"

[[group]]
id = "kernel-mem"
invariant = "The heap (`GlobalAlloc` over a free-region list of `&'static mut` nodes under a spin lock), the frame allocator (poisoning and accounting under `debug_assertions`, which IS the shipping profile) and the TLB shootdown. The contracts are the allocator's: a freed region was allocated here and is not referenced. `unsafe impl GlobalAlloc` is the ABI the language requires."
match = [{ file = "src/kernel/mem/**" }]
category = "contained-implementation"
owner = "kernel/mem"
disposition = "keep"

[[group]]
id = "kernel-sync"
invariant = "`SpinLock<T>: Send + Sync` for `T: Send` and `Console: Send` - the standard exclusion argument: the lock hands out one `&mut T` at a time."
match = [{ file = "src/kernel/sync.rs" }, { file = "src/kernel/console.rs" }]
category = "contained-implementation"
owner = "kernel"
disposition = "keep"

[[group]]
id = "kernel-sched-and-objects"
invariant = "The scheduler's per-CPU run queues (a leaked table indexed by the current CPU), the context-switch calls whose saved-frame contract is the arch's, thread stacks (frames owned by the stack for its life, guard-page checks by volatile read) and the idle hook stored as an integer and restored to the `fn()` it came from."
match = [{ file = "src/kernel/sched/**" }, { file = "src/kernel/object/**" }]
category = "contained-implementation"
owner = "kernel/sched"
disposition = "keep"

[[group]]
id = "kernel-main-loader-device"
invariant = "Kernel entry (the `#[no_mangle]` entry point), user program loading (writes into a freshly created address space through kernel mappings the loader owns), PCI device enumeration and MMIO to configuration space and BARs the device census resolved. Contained behind the object layer."
match = [
	{ file = "src/kernel/main.rs" },
	{ file = "src/kernel/loader.rs" },
	{ file = "src/kernel/device.rs" },
	{ file = "src/kernel/device/**" },
	{ file = "src/kernel/pci/**" },
	{ file = "src/kernel/dma_policy/**" },
	{ file = "src/kernel/extable.rs" },
	{ file = "src/kernel/perf/**" },
	{ file = "src/kernel/product/**" },
]
category = "contained-implementation"
owner = "kernel"
disposition = "keep"

[[group]]
id = "kernel-remaining"
invariant = "The remaining kernel sites: named in the report's kernel table by file; each reviewed as contained behind a safe API, with its invariant stated there."
match = [{ file = "src/kernel/**" }]
category = "contained-implementation"
owner = "kernel"
disposition = "keep"

# --- userspace, by cohort (M3) ---------------------------------------------------------------

[[group]]
id = "rt-raw-syscall"
invariant = "The raw `syscall` entry: inline assembly issuing the trap with the register convention the kernel expects. The caller contract is the whole syscall ABI - every argument that is a pointer must be valid for the kernel's copy - and it is genuinely the caller's."
match = [{ file = "src/user/runtime/rt/src/lib.rs", item = "crate::syscall" }]
category = "required-caller-enforced"
owner = "rt"
disposition = "keep"

[[group]]
id = "rt-address-returning"
invariant = "Wrappers that hand the caller a raw ADDRESS to dereference - a mapped MemoryObject, a DMA buffer, the framebuffer, the memory map: the returned address is valid for the object's length until unmapped, and that is the caller's obligation to respect, so `unsafe fn` is the honest signature."
match = [
	{ file = "src/user/runtime/rt/src/lib.rs", item = "crate::map_object" },
	{ file = "src/user/runtime/rt/src/lib.rs", item = "crate::dma_buffer_map" },
	{ file = "src/user/runtime/rt/src/lib.rs", item = "crate::framebuffer_map" },
	{ file = "src/user/runtime/rt/src/lib.rs", item = "crate::memmap_get" },
	{ file = "src/user/runtime/rt/src/lib.rs", item = "crate::dma_buffer_phys*" },
	{ file = "src/user/runtime/rt/src/lib.rs", item = "crate::process_load_module" },
	{ file = "src/user/runtime/rt/src/lib.rs", item = "crate::process_load_main" },
	{ file = "src/user/runtime/rt/src/lib.rs", item = "crate::move_bytes" },
]
category = "required-caller-enforced"
owner = "rt"
disposition = "keep"

[[group]]
id = "rt-heap-stream-and-linkage"
invariant = "The runtime's own allocator (`GlobalAlloc`, `Sync` for the locked heap), the stream frame reader over a mapped object, the process entry (`liber_rt_start`, `__user_main`) and the shared-image `memcpy`/`memset` forwarding stubs: the language's and the linker's ABI."
match = [
	{ file = "src/user/runtime/rt/src/heap.rs" },
	{ file = "src/user/runtime/rt/src/stream.rs" },
	{ file = "src/user/runtime/rt/src/lib.rs", kind = [
		"linkage-attr",
		"global-asm",
		"extern-block",
		"extern-abi-fn",
		"unsafe-impl",
	] },
]
category = "abi-linkage"
owner = "rt"
disposition = "keep"

[[group]]
id = "rt-propagated-wrappers"
invariant = "What the runtime keeps after the wrappers took the signature their contract has. The raw `syscall` is one item per architecture and is inline assembly; the ten wrappers that hand the caller an address or a slice over a mapping - `map_object`, `memmap_get`, `dma_buffer_map`, `dma_buffer_phys`, `dma_buffer_phys_at`, `dma_buffer`, `dma_buffer_for`, `framebuffer_map`, `process_load_module`, `recv_package` - each carry a written `# Safety` contract naming what the caller owes; the `unsafe {}` blocks inside the now-safe wrappers are where the raw call's pointer contract is DISCHARGED, which is what lets their signatures be safe; and the shared-image `mem*` implementations are the C library contract the compiler emits calls to. The hundred and twenty-three wrappers that only propagated are safe `fn` now, and the two unmap wrappers say in as many words why ending a mapping is not itself a caller obligation."
match = [{ file = "src/user/runtime/rt/src/lib.rs" }]
category = "required-caller-enforced"
owner = "rt"
disposition = "keep"

[[group]]
id = "drivers-mmio-and-dma"
invariant = "Device registers are reached through the MMIO span the kernel mapped for the claim, DMA rings and buffers through `DmaAddress`-backed buffers the kernel handed out; descriptor and ring writes are volatile and ordered by the barriers the virtio and xHCI specifications require. The raw pointers name those spans and nothing else. Falsified by the enforcing-IOMMU gate (a physical address in a descriptor faults) and the drivers' hostile-device host tests."
match = [{ file = "src/user/drivers/**", kind = ["raw-pointer", "unsafe-block", "static-mut"] }]
category = "contained-implementation"
owner = "drivers"
disposition = "keep"

[[group]]
id = "drivers-entry-linkage"
invariant = "Each driver's `extern \"C\" fn __user_main` and its `#[unsafe(no_mangle)]`: the runtime's entry ABI."
match = [{ file = "src/user/drivers/**", kind = ["extern-abi-fn", "linkage-attr", "extern-block"] }]
category = "abi-linkage"
owner = "drivers"
disposition = "keep"

[[group]]
id = "drivers-propagated-wrappers"
invariant = "The drivers' remaining `unsafe fn`s, after the ones that only called the runtime went safe with it. What is left is the bring-up and ring work whose bodies reach device memory: the MMIO accessors every virtio driver funnels through, the queue and descriptor writers, the xHCI context builders. Their contract is the one `drivers-mmio-and-dma` states - the span is the claim's mapping and nothing else - and `common.rs`, which was twenty-nine `unsafe fn`s of pure propagation, has none left."
match = [{ file = "src/user/drivers/**", kind = ["unsafe-fn"] }]
category = "contained-implementation"
owner = "drivers"
disposition = "keep"

[[group]]
id = "services-mapped-views"
invariant = "Raw pointers in services are views over MemoryObjects the kernel mapped whole (`map_object`) at the length the same service or the kernel reported, unmapped and closed after use; the display and audio engines additionally write into DMA-visible buffers the driver published for that purpose."
match = [
	{ file = "src/user/services/**", kind = [
		"raw-pointer",
	] },
	{ file = "src/user/services/core/src/display_service.rs" },
	{ file = "src/user/services/core/src/audio_engine.rs" },
]
category = "contained-implementation"
owner = "services"
disposition = "keep"

[[group]]
id = "services-entry-linkage"
invariant = "Every service's `extern \"C\" fn __user_main` and `#[unsafe(no_mangle)]`: the runtime's entry ABI."
match = [
	{ file = "src/user/services/**", kind = [
		"extern-abi-fn",
		"linkage-attr",
		"extern-block",
	] },
]
category = "abi-linkage"
owner = "services"
disposition = "keep"

[[group]]
id = "services-wrapped-runtime-calls"
invariant = "What is left in the services once the runtime's wrappers are safe: blocks that still hold at least one genuinely unsafe call - a mapped-object view, a `map_object` or `process_load_module`, a provider import - and the `unsafe fn`s whose bodies do that work. A block counts once however many safe calls it also contains, which is why the count does not go to zero: eight hundred and fifty-nine of the nine hundred and eighty-four sites were propagation and are gone."
match = [{ file = "src/user/services/**" }]
category = "contained-implementation"
owner = "services"
disposition = "keep"

[[group]]
id = "apps-entry-linkage"
invariant = "Each tool's `extern \"C\" fn __user_main` and `#[unsafe(no_mangle)]`: the runtime's entry ABI (seventy-five programs)."
match = [{ file = "src/user/apps/**", kind = ["extern-abi-fn", "linkage-attr", "extern-block"] }]
category = "abi-linkage"
owner = "apps"
disposition = "keep"

[[group]]
id = "apps-mapped-views"
invariant = "The tools' raw pointers: `from_raw_parts` over a file the storage service mapped whole, read once and unmapped."
match = [{ file = "src/user/apps/**", kind = ["raw-pointer"] }]
category = "contained-implementation"
owner = "apps"
disposition = "keep"

[[group]]
id = "apps-wrapped-runtime-calls"
invariant = "What is left in the tools: the entry blocks that still call one `unsafe fn` of their own - a pump or a viewer that reads a mapped file - and the `global_asm!` shims. Three hundred and thirty-two of the three hundred and ninety-three sites were the runtime's propagation and are gone; a block that holds one unsafe call and twenty safe ones still counts once."
match = [{ file = "src/user/apps/**" }]
category = "contained-implementation"
owner = "apps"
disposition = "keep"

[[group]]
id = "libs-shared-image-exports"
invariant = "The shared-image provider ABI: generated `#[unsafe(export_name)]` wrappers in the protocol crates, the `forward!` `global_asm!` templates that alias an exported symbol to its implementation per architecture, and the `extern` blocks a client crate declares for its provider's entry points. All of it is generated from the interface definitions and audited by the package identity and the export-owner checks."
match = [
	{ file = "src/user/libs/**", kind = [
		"linkage-attr",
		"global-asm",
		"macro-template",
		"extern-block",
		"extern-abi-fn",
	] },
]
category = "abi-linkage"
owner = "libs (generated)"
disposition = "keep"

[[group]]
id = "libs-ipc-and-driver-protocol"
invariant = "The IPC client's `unsafe fn`s over runtime calls, and the driver protocol's raw pointers into DMA-visible frames it describes for the drivers."
match = [{ file = "src/user/libs/ipc/**" }, { file = "src/user/libs/driver/**" }]
category = "contained-implementation"
owner = "libs"
disposition = "keep"

[[group]]
id = "libs-wrapped-runtime-calls"
invariant = "The client libraries' remaining blocks, which are calls into the shared-image PROVIDER IMPORTS - `unsafe extern \"C\"` entry points the generated bindings declare and the loader resolves - and not runtime propagation. A foreign function is unsafe because its contract is not Rust's to check; these are the audited export names of `libs-shared-image-exports`, called from the safe client API."
match = [{ file = "src/user/libs/**" }]
category = "abi-linkage"
owner = "libs"
disposition = "keep"

[[group]]
id = "sdk-component-boundary"
invariant = "The WASM component's side of the host contract: the host imports it declares (`unsafe extern \"C\"` in the SDK's world module, wrapped by the SDK's safe API) and the `#[unsafe(no_mangle)] extern \"C\"` exports the interpreter calls by name. The interpreter's side (`src/wasm`) contains no unsafe code: every import is dispatched by name and validated by the host."
match = [{ file = "src/sdk/**" }]
category = "abi-linkage"
owner = "sdk"
disposition = "keep"

[[group]]
id = "loader-firmware-and-handoff"
invariant = "The UEFI loader: firmware tables and protocols are raw pointers the firmware handed the image entry (boot services, file and block protocols, variables), used while boot services are live and never after; the memory map, the ELF placement and the kernel hand-off write physical memory the firmware's map declared free; `static mut` state is single-threaded and reached only from the boot path (said at each one). The port hand-offs are inline assembly."
match = [{ file = "src/boot/**" }]
category = "required-caller-enforced"
owner = "boot"
disposition = "keep"

[[group]]
id = "term-raster"
invariant = "The terminal raster draws into a framebuffer mapping through a raw address. `Raster::new` is `unsafe fn` with a written contract - a readable, writable, unaliased mapping of at least `pitch * height` bytes for the raster's life - and validates the geometry itself; every pixel write and read is bounds-checked against that geometry before the volatile access. Shared by the kernel console and the userspace display path."
match = [{ file = "src/term/**", kind = ["unsafe-fn"] }]
category = "required-caller-enforced"
owner = "term"
disposition = "keep"

[[group]]
id = "term-raster-internals"
invariant = "The pixel accesses inside the raster: bounds-checked offsets into the mapping `Raster::new` vouched for, written and read volatile."
match = [{ file = "src/term/**" }]
category = "contained-implementation"
owner = "term"
disposition = "keep"

[[group]]
id = "shared-crates-misc"
invariant = "The remaining shared crates: the DMA address contract's raw-pointer views, the wire codec's provider externs."
match = [
	{ file = "src/dma/**" },
	{ file = "src/wire/**" },
	{ file = "src/abi/**" },
	{ file = "src/fs/**" },
	{ file = "src/buddy/**" },
]
category = "contained-implementation"
owner = "shared"
disposition = "keep"
