# P02M0118: the part of the model that cannot be derived.
#
# Everything a tool can compute is computed: a crate's component is its package name, its
# `link.static` / `link.static.dev` / `generation.build` edges are its Cargo dependency tables, and
# its `link.dynamic` edges are services/manifest.toml's providers. What is left here is what no file
# in the tree states: which component owns a path that is not inside a crate, which edges exist only
# at run time or through a generator, which targets a change can affect, and what is not code.
#
# The rule for adding to this file: if the answer is written down somewhere else in the tree, read it
# there instead. A second copy of a derivable fact is a second answer that can disagree with the
# first, and the hand-written one is the one that gets consulted.

schema = 1

# ---------------------------------------------------------------------------------------------
# Ownership
#
# Longest matching prefix wins, and these compete with crate containment on the same footing - so
# `src/kernel/arch/x86_64` beats the `kernel` crate at `src/kernel` because it is longer, which is
# exactly what the architecture policy needs. A path matching nothing is UNKNOWN, and unknown reach
# selects everything.

[[ownership]]
path = "src/kernel/arch/x86_64"
component = "kernel.arch.x86_64"

[[ownership]]
path = "src/kernel/arch/aarch64"
component = "kernel.arch.aarch64"

[[ownership]]
path = "src/kernel/arch/riscv64"
component = "kernel.arch.riscv64"

[[ownership]]
path = "src/kernel/linker/x86_64.ld"
component = "kernel.arch.x86_64"

[[ownership]]
path = "src/kernel/linker/aarch64.ld"
component = "kernel.arch.aarch64"

[[ownership]]
path = "src/kernel/linker/riscv64.ld"
component = "kernel.arch.riscv64"

# The three userspace linker scripts are per-target the same way, but the script that CHOOSES
# between them is not - see the architecture policy below, where that distinction is the point.
[[ownership]]
path = "src/user/user.ld"
component = "userspace.link.x86_64"

[[ownership]]
path = "src/user/user-aarch64.ld"
component = "userspace.link.aarch64"

[[ownership]]
path = "src/user/user-riscv64.ld"
component = "userspace.link.riscv64"

[[ownership]]
path = "src/user/x86_64-unknown-none.json"
component = "userspace.link.x86_64"

[[ownership]]
path = "src/user/build.rs"
component = "userspace.build"

[[ownership]]
path = "src/user/rust-toolchain.toml"
component = "userspace.build"

[[ownership]]
path = "src/user/.cargo"
component = "userspace.build"

[[ownership]]
path = "src/.cargo"
component = "harness.tools"

# The repository-root cargo configuration. It is not documentation: it decides where every build
# output lands, which is the difference between a gate inspecting this build and the previous one.
[[ownership]]
path = ".cargo"
component = "harness.tools"

# The manifest is a build INPUT, not only the file the provider graph is read from: `system-manifest`
# is a build-dependency of the kernel and of CoreServices, and their build scripts generate source
# from it. Its `generation.build` edges are declared below.
[[ownership]]
path = "src/user/services/manifest.toml"
component = "manifest"

# The interface definitions every generated protocol crate is produced from. `./gen.sh` passes
# `idl/*.lsidl` to every one of the sixteen, so one .lsidl reaches all of them.
[[ownership]]
path = "src/idl"
component = "idl"

# The harness: what builds the image, what boots it, and what judges the guest. A change here can
# alter what the system IS and how it is measured, so it is not a component that ships - it is a
# component every guest run depends on. See the edges below.
[[ownership]]
path = "src/boot"
component = "harness.boot"

[[ownership]]
path = "src/tools"
component = "harness.tools"

# The entry-point scripts and the shared library behind them.
[[ownership]]
path = "lib.sh"
component = "harness.scripts"

[[ownership]]
path = "build.sh"
component = "harness.scripts"

[[ownership]]
path = "check.sh"
component = "harness.scripts"

[[ownership]]
path = "test.sh"
component = "harness.scripts"

[[ownership]]
path = "verify.sh"
component = "harness.scripts"

[[ownership]]
path = "image.sh"
component = "harness.scripts"

[[ownership]]
path = "run.sh"
component = "harness.scripts"

[[ownership]]
path = "clean.sh"
component = "harness.scripts"

[[ownership]]
path = "format.sh"
component = "harness.scripts"

[[ownership]]
path = "setup.sh"
component = "harness.scripts"

[[ownership]]
path = "gen.sh"
component = "harness.scripts"

[[ownership]]
path = "lab.sh"
component = "harness.scripts"

[[ownership]]
path = "bench.sh"
