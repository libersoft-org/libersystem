# ---------------------------------------------------------------------------------------------
# Host suites that cannot run on the host
#
# A crate here declares `#[test]`s that `cargo test` genuinely cannot execute, and saying so is the
# point: an inventory that silently omits a crate looks exactly like an inventory that covers it.
# Each entry is a debt with a named cause, not an exemption.

# Nothing is excluded here any more.
#
# There WAS one entry - `services`, whose four suites of pure logic could not be built for
# `cargo test` because every binary in that crate links `rt`, and `rt`'s `panic_impl` collides with
# the `std` the test harness needs. It was recorded here with its cause rather than left as a
# silent gap, and then fixed the way the record said it should be: the logic moved to
# `user/services/logic`, a crate that links no runtime, and its 24 tests now run on the host in
# milliseconds. The section stays because the next such debt should be written down the same way.
# A whole configuration that cannot be host-tested, stated once with its cause - and, measured, with
# nothing lost by it.
#
# Of the sixteen crates declaring `shared-image`, fifteen fail to build for `cargo test` in it, all
# with the same error: the feature activates `ipc-client`, which links `rt`, whose `panic_impl`
# collides with the `std` the harness needs. E0152, before a test runs.
#
# What that costs was then measured rather than assumed, and the answer is: nothing. All 94 tests in
# those crates are wire-stability assertions over generated codec code, and NOT ONE of them is
# behind `channel-client-impl` or any other feature. Running them again under `shared-image` would
# execute the same assertions over the same bytes. The feature adds client method implementations,
# and those carry no tests in any configuration - which is a coverage gap in the glue, not a
# configuration that is going untested, and it belongs to whoever writes those tests rather than to
# the selector.
#
# So this rule keeps fifteen permanently-red keys out of the catalog and loses no coverage doing it.
# If a test is ever written that IS feature-gated, this entry becomes wrong and must go.
[[host_configuration_unrunnable]]
configuration = "shared-image"
when_static_reach = "rt"
reason = "the shipping feature set links rt, whose panic_impl collides with the std that `cargo test` needs (E0152) - and every test in the affected crates is configuration-independent, so the variant would assert nothing new"

# ---------------------------------------------------------------------------------------------
# Components that select everything
#
# Fail open, as a written list rather than as a habit. A change to any of these makes the whole
# plan FULL - not because the closure could not be computed, but because the thing that changed is
# what the closure is computed WITH, or is reached by so much of the system that a narrower answer
# would be a guess dressed as an inference.
#
# This applies to a CHANGED component, not to a merely affected one. `flac` reaching `kernel`
# through a dev-dependency is a reason to rebuild the kernel's test binary; it is not a reason to
# run every conformance suite.

[[selects_everything]]
component = "harness.boot"
reason = "builds the image, boots the guest and judges it - it decides what every other answer means"

[[selects_everything]]
component = "harness.tools"
reason = "the builders, packagers and gates; mkpackages' output IS the system volume"

[[selects_everything]]
component = "harness.scripts"
reason = "the entry points and lib.sh, which is where the selection itself is spelled"

# The host tool crates that produce or describe what ships. They live under `src/tools`, which is
# already declared harness.tools - but each is its OWN crate, and crate containment is a longer
# prefix than the directory rule, so containment wins and they would fall out of the escalation.
#
# That is not hypothetical: `src/tools/mkpackages/src/main.rs` resolved to the `mkpackages` crate and
# planned a scoped run. It is the same defect an earlier review found in `lib.sh` - "change the thing
# that builds the system, test nothing" - reappearing in the model that replaced it, and it was found
# by the test that enumerates these triggers rather than by anybody noticing.
[[selects_everything]]
component = "mkpackages"
reason = "its output IS the system volume; a change here changes every file the image ships"

[[selects_everything]]
component = "system-manifest"
reason = "a build-dependency of the kernel and CoreServices whose build scripts generate their source from it"

[[selects_everything]]
component = "lsidl-gen"
reason = "regenerates all sixteen protocol crates, so a change to it can change every wire message"

[[selects_everything]]
component = "verify-model"
reason = "the selector; a selector cannot vouch for a change to itself"

[[selects_everything]]
component = "kernel"
reason = "phase one keeps shared kernel subsystems whole - narrowing mem/sched/object/syscall is where a selector is most likely to be wrong, and P02M0118 defers it until there is shadow evidence per change class"

[[selects_everything]]
component = "abi"
reason = "the kernel/userspace contract; every syscall and every right is defined here"

[[selects_everything]]
component = "bootproto"
reason = "what the loader hands the kernel; a layout change is invisible until something boots"

[[selects_everything]]
component = "wire"
reason = "the encoding every protocol message is carried in"

[[selects_everything]]
component = "manifest"
reason = "declares every destination in the image and generates source into the kernel and CoreServices"

[[selects_everything]]
component = "idl"
reason = "regenerates all sixteen protocol crates"

[[selects_everything]]
component = "rt"
reason = "the shared runtime every dynamic executable starts through"

[[selects_everything]]
component = "product"
reason = "stamped into every artifact through cargo:rustc-env"

# ---------------------------------------------------------------------------------------------
# Risk classes: written now, applied later
#
# `src/kernel` is one bucket outside its per-target arch trees, and a timer change should not cost
# 205 tests on three architectures forever. But narrowing a kernel subsystem is where a selector is
# most likely to be WRONG - these are the layers every other layer stands on, and a missed edge here
# does not show up as a slow suite, it shows up as a shipped fault.
#
# So the classes are written down and NOT applied. Each subsystem below still selects everything,
# because `kernel` is on the list above and these paths are inside it. What changes when the
# evidence exists is one line: give the subsystem an `[[ownership]]` rule of its own and take it off
# the escalation. The `evidence` field says what has to be true first, and `verify-model check`
# prints the table so the debt is visible rather than remembered.
#
# The driver crate needed the same treatment and did not need a rule: `[[bin]]` entries already make
# every driver its own component, so a keyboard change reaches `bin.usb_hid` and boots one target.

[[risk_class]]
path = "src/kernel/mem"
class = "foundational"
evidence = "shadow-clean on all three targets for allocator and page-table changes; a missed edge here is a use-after-free that surfaces somewhere else entirely"

[[risk_class]]
path = "src/kernel/object"
class = "foundational"
evidence = "shadow-clean across capability, channel, handle and domain changes; every test in the suite holds handles, so the blast radius is genuinely wide"

[[risk_class]]
path = "src/kernel/sched"
class = "foundational"
evidence = "shadow-clean including SMP and preemption changes; scheduling faults present as unrelated timeouts"

[[risk_class]]
path = "src/kernel/syscall"
class = "contract"
evidence = "shadow-clean plus the ABI unchanged; this is the boundary every userspace test crosses"

[[risk_class]]
path = "src/kernel/elf.rs"
class = "narrowable"
evidence = "shadow-clean for loader changes; the loader is exercised by a nameable set of tests rather than by all of them"

[[risk_class]]
path = "src/kernel/smp"
class = "narrowable"
evidence = "shadow-clean for core-bring-up changes"

[[risk_class]]
path = "src/kernel/test_suites"
class = "narrowable"
evidence = "a test file reaches the tests in it; once `covers` is on every test this is derivable rather than declarable, and this row disappears"

# ---------------------------------------------------------------------------------------------
# Declared edges
#
# The ones a linker cannot see. Each is written ONCE between components rather than repeated in
# every test's `covers`, because a change to something everything speaks - the IDL, the manifest,
# the harness - would otherwise have to be written into every test file, which rebuilds the
# hand-maintained table this whole model replaces.

# Generation: every protocol crate is produced from the whole `idl/*.lsidl` set, so one interface
# file reaches all sixteen. `./gen.sh` passes the glob; this says the same thing to the planner.
[[edge]]
from = [
	"base-proto",
	"audio-proto",
	"config-proto",
	"device-proto",
	"display-proto",
	"input-proto",
	"log-proto",
	"network-proto",
	"observability-proto",
	"process-proto",
	"resources-proto",
	"security-proto",
	"session-proto",
	"storage-proto",
	"time-proto",
	"proto",
]
to = "idl"
kind = "generation"
reason = "generated by lsidl-gen from the whole idl/*.lsidl set"

[[edge]]
from = [
	"base-proto",
	"audio-proto",
	"config-proto",
	"device-proto",
	"display-proto",
	"input-proto",
	"log-proto",
	"network-proto",
	"observability-proto",
	"process-proto",
	"resources-proto",
	"security-proto",
	"session-proto",
	"storage-proto",
	"time-proto",
	"proto",
]
to = "lsidl-gen"
kind = "generation"
reason = "the generator itself; a change to it changes what every protocol crate contains"

# The manifest generates source into the kernel and CoreServices through system-manifest, which is
# a build-dependency of both. The `generation.build` edge to system-manifest is derived from Cargo;
# this is the edge to the DATA that build script reads, which Cargo cannot see.
[[edge]]
from = ["kernel", "services"]
to = "manifest"
kind = "generation"
reason = "build.rs generates manifest.rs, library_paths.rs and program_paths.rs from it"

# The SDK payload. `component_host` loads `components/liber_component/app.wasm` from the volume at
# run time; the manifest declares it as a factory file and no linker sees the edge at all. Found by
# the `covers` reachability gate, which reported that the scenario asserting on that component could
# not reach the crate that produces it - correctly, because the edge did not exist.
[[edge]]
from = "bin.component_host"
to = "liber_component"
kind = "format"
reason = "loads the SDK component payload the crate builds, staged as components/liber_component/app.wasm"

# The version string every build stamps in through cargo:rustc-env.
[[edge]]
from = ["kernel", "services"]
to = "product"
kind = "generation"
reason = "build.rs emits cargo:rustc-env=PRODUCT_VERSION from product.conf"

# The userspace build script and the linker scripts it selects. Cargo records `build = "../../build.rs"`
# per crate but `cargo metadata` does not expose it as a dependency edge, so it is declared.
[[edge]]
from = ["userspace.build"]
to = ["userspace.link.x86_64", "userspace.link.aarch64", "userspace.link.riscv64"]
kind = "generation"
reason = "build.rs maps target_arch to one of the three scripts and passes it via cargo:rustc-link-arg"

# ---------------------------------------------------------------------------------------------
# Architecture policy
#
# Per target, not per category. Longest matching prefix wins. The distinction that matters and is
# easy to get wrong: a file that is PER TARGET selects its target, and a file that CHOOSES BETWEEN
# targets selects all of them. `user-riscv64.ld` is the first kind; `src/user/build.rs`, which maps
# target_arch to one of the three, is the second - a bug in its mapping is invisible on the target
# it maps correctly.
#
# `build` is which targets must compile; `boot` is which guests must run. Cross-building all three
# proves a branch compiles, not that it is right, so `build` is never the whole answer.

[[architecture]]
path = "src/kernel/arch/x86_64"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["x86_64"]

[[architecture]]
path = "src/kernel/arch/aarch64"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["aarch64"]

[[architecture]]
path = "src/kernel/arch/riscv64"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["riscv64"]

[[architecture]]
path = "src/kernel/linker/x86_64.ld"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["x86_64"]

[[architecture]]
path = "src/kernel/linker/aarch64.ld"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["aarch64"]

[[architecture]]
path = "src/kernel/linker/riscv64.ld"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["riscv64"]

[[architecture]]
path = "src/loader/src/arch/x86_64"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["x86_64"]

[[architecture]]
path = "src/loader/src/arch/aarch64"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["aarch64"]

[[architecture]]
path = "src/loader/src/arch/riscv64"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["riscv64"]

[[architecture]]
path = "src/user/user.ld"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["x86_64"]

[[architecture]]
path = "src/user/user-aarch64.ld"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["aarch64"]

[[architecture]]
path = "src/user/user-riscv64.ld"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["riscv64"]

[[architecture]]
path = "src/user/x86_64-unknown-none.json"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["x86_64"]

# The choosers and the shared halves: all three, because a bug in the mapping or in shared code is
# invisible on the target that happens to be right.
[[architecture]]
path = "src/user/build.rs"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["x86_64", "aarch64", "riscv64"]

[[architecture]]
path = "src/kernel/arch/mod.rs"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["x86_64", "aarch64", "riscv64"]

[[architecture]]
path = "src/kernel/arch/common"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["x86_64", "aarch64", "riscv64"]

[[architecture]]
path = "src/kernel/arch/tests.rs"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["x86_64", "aarch64", "riscv64"]

[[architecture]]
path = "src/loader/src/arch/mod.rs"
build = ["x86_64", "aarch64", "riscv64"]
boot = ["x86_64", "aarch64", "riscv64"]

# Shared loader source. The loader has both kinds of file in one crate, which is why it gets more
# than one row: `main.rs` and `uefi.rs` are not per-target, and a fault in either shows on one
# target and not the others.
[[architecture]]
