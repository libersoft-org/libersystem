# The artifact and configuration matrix the unsafe-boundary inventory is taken over.
#
# DERIVED FROM THE BUILD, NOT NAMED. Each row records what `build.sh`, `build-shared.sh` and the
# cargo configurations actually do: the shipping kernel is Cargo's DEV profile (so
# `debug_assertions` is on in it), static userspace is the dev profile with `development` on for
# two crates only when LIBER_DEVELOPMENT=1, shared-image userspace is release with the custom
# target spec, `-Z build-std` and `--no-default-features --features shared-image`, and the shipping
# WASM component is a release build for `wasm32-unknown-unknown`. The loader rows are shipped code
# too and are included although the audit's own list does not name them.
#
# `cfg` is the set of predicates a row answers true; anything not listed is false in that row, which
# is the conservative reading and is where a missing predicate is added. `target_dir` is where a
# build of the row leaves `OUT_DIR` files, read for generated code.

exclude_crates = []

# --- the kernel, one row per architecture ---------------------------------------------------

[[row]]
id = "kernel-x86_64"
kind = "shipping"
description = "the shipping kernel on x86_64: dev profile, build-std, static relocation model"
roots = [{ manifest = "src/kernel/Cargo.toml", package = "kernel" }]
target = "x86_64-unknown-none"
profile = "dev"
build_std = ["core", "compiler_builtins", "alloc"]
rustflags = ["-C", "relocation-model=static"]
cfg = [
	'target_arch = "x86_64"',
	'target_os = "none"',
	'target_pointer_width = "64"',
	'target_endian = "little"',
	'target_has_atomic = "64"',
	'target_has_atomic = "32"',
	'target_has_atomic = "8"',
	'target_has_atomic = "16"',
	'target_has_atomic = "ptr"',
	'debug_assertions',
	'panic = "abort"',
]
target_dirs = [".build/cargo/kernel"]

[[row]]
id = "kernel-aarch64"
kind = "shipping"
description = "the shipping kernel on AArch64: dev profile, build-std, static, no-pie"
roots = [{ manifest = "src/kernel/Cargo.toml", package = "kernel" }]
target = "aarch64-unknown-none"
profile = "dev"
build_std = ["core", "compiler_builtins", "alloc"]
rustflags = ["-C", "relocation-model=static", "-C", "link-arg=-no-pie"]
cfg = [
	'target_arch = "aarch64"',
	'target_os = "none"',
	'target_pointer_width = "64"',
	'target_endian = "little"',
	'target_has_atomic = "64"',
	'target_has_atomic = "32"',
	'target_has_atomic = "8"',
	'target_has_atomic = "16"',
	'target_has_atomic = "ptr"',
	'debug_assertions',
	'panic = "abort"',
]
target_dirs = [".build/cargo/kernel"]

[[row]]
id = "kernel-riscv64"
kind = "shipping"
description = "the shipping kernel on RISC-V: dev profile, build-std, static, medium code model"
roots = [{ manifest = "src/kernel/Cargo.toml", package = "kernel" }]
