# --- the development-only closure: services and drivers with `development` on ----------------

[[row]]
id = "development-user-x86_64"
kind = "development"
description = "the development configuration of services and drivers (LIBER_DEVELOPMENT=1) on x86_64"
roots = [
	{ manifest = "src/user/services/core/Cargo.toml", package = "services" },
	{ manifest = "src/user/drivers/core/Cargo.toml", package = "drivers" },
]
target = "src/user/x86_64-unknown-none.json"
profile = "dev"
features = ["development"]
build_std = ["core", "compiler_builtins", "alloc"]
rustflags = ["-C", "relocation-model=static"]
env = { LIBER_DEVELOPMENT = "1" }
cfg = [
	'target_arch = "x86_64"',
	'target_os = "none"',
	'target_pointer_width = "64"',
	'target_endian = "little"',
	'target_has_atomic = "64"',
	'target_has_atomic = "32"',
	'target_has_atomic = "8"',
	'target_has_atomic = "16"',
	'target_has_atomic = "ptr"',
	'debug_assertions',
	'feature = "development"',
]
target_dirs = [".build/cargo/user"]

# --- shared-image userspace: every staged library and every dynamically linked program --------

[[row]]
id = "shared-image-x86_64"
kind = "shipping"
description = "shared-image userspace on x86_64: release, custom target, build-std, PIC, no default features"
manifest_roots = { manifest = "src/user/services/manifest.toml", libraries = true, programs = "dynamic" }
target = "src/user/x86_64-unknown-none.json"
profile = "release"
# per-root features come from the manifest rows (libraries) and `shared-image` (dynamic programs)
no_default_features = true
build_std = ["core", "alloc", "compiler_builtins"]
rustflags = ["-C", "relocation-model=pic"]
cfg = [
	'target_arch = "x86_64"',
	'target_os = "none"',
	'target_pointer_width = "64"',
	'target_endian = "little"',
	'target_has_atomic = "64"',
	'target_has_atomic = "32"',
	'target_has_atomic = "8"',
	'target_has_atomic = "16"',
	'target_has_atomic = "ptr"',
	'feature = "shared-image"',
]
target_dirs = [
	".build/cargo/image-x86_64-unknown-none",
	".build/cargo/provider-x86_64-unknown-none",
]

