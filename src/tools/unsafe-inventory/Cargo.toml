[package]
name = "unsafe-inventory"
edition = "2024"
description = "Inventory every production unsafe boundary across the derived artifact and configuration matrix"

[[bin]]
name = "unsafe-inventory"
path = "src/main.rs"

[dependencies]
syn = { version = "2.0.117", features = ["full", "visit", "extra-traits", "parsing", "printing"] }
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.9.12"

sha2 = "0.10.9"

[lints.rust]
warnings = "deny"
