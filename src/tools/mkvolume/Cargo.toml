[package]
name = "mkvolume"
edition = "2024"
description = "Build a LiberFS system volume image on the host, so the loader has a volume to read"

[dependencies]
# The same filesystem crate the loader and the storage service use. An image built here and a
# volume formatted at runtime are the same format because they are the same code, not because
# two implementations were kept in step.
liberfs = { path = "../../fs/liberfs" }
fscore = { path = "../../fs/core" }

[profile.dev]
opt-level = 2
