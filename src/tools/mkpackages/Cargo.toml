[package]
name = "mkpackages"
edition = "2024"
description = "Assemble the boot packages from a built userspace"

[[bin]]
name = "mkpackages"
path = "src/main.rs"

[dependencies]
# The system volume is now built here as a real LiberFS image, not only as an archive. It uses
# the same crate the loader and the storage service use, so a built image and a volume formatted
# at runtime are the same format because they are the same code.
liberfs = { path = "../../fs/liberfs" }
fscore = { path = "../../fs/core" }
# The PKGARCH1 archive format constants, shared with the kernel and the storage runtime.
abi = { path = "../../abi" }
# ELF parsing for the identity records and the dynamic-linkage audit.
bootproto = { path = "../../boot/protocol" }
# Signing the staged set's manifest with the published test key. The verifier is a different crate,
# linked into the loader; this is the half that makes a manifest and never verifies one.
sign-manifest = { path = "../sign-manifest" }
# The component parser, so a staged `.wasm` is validated with the SAME code that will have to run
# it - a toolchain that emits something this interpreter cannot represent fails the BUILD rather
# than the boot.
wasm = { path = "../../wasm" }
# The manifest that decides what is staged where.
system-manifest = { path = "../system-manifest" }

# A WARNING IS AN ERROR HERE. P02M0144 took ninety-one `allow` attributes out of this tree and found
# a hundred and twenty warnings underneath them - a duplicate register read a driver was told to
# call, a field whose comment said it kept a DMA buffer alive and which nothing read, a HAL entry
# all three backends declared and none called. None of that was reported, because the reporting had
# been switched off file by file over years, unevenly, and nobody had decided it.
#
# `[lints]` rather than `RUSTFLAGS`: this denies in THIS package only. RUSTFLAGS would deny inside
# `build-std`'s `core` and `compiler_builtins` too, where a warning is not ours to answer.
[lints.rust]
warnings = "deny"
