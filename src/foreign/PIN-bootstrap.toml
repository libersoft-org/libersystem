# THE BOOTSTRAP PART OF THE FOREIGN SUBSTRATE'S LOCKFILE. Frozen after the bootstrap inputs exist, and it gates
# pass 1.
#
# WHAT BELONGS IN THIS PART AND WHAT DOES NOT. Everything here has its CONTENT decided independently
# of this milestone's own measurements. The cross files and the bootstrap sysroot ARE output of this
# milestone and are still safe here, because what creates a cycle is an input sized by a MEASUREMENT
# this part gates - and these two are sized by the OPTION SET below, which needs nothing compiled to
# be read.
#
# THE BUILD READS THESE VALUES RATHER THAN DUPLICATING THEM. A build that takes a pinned value from
# anywhere but the part of the lockfile that owns it fails.

[upstream.vulkan-loader]
# AUDIT-ONLY. Compiled, audit-linked, inspected and quarantine-staged for the guest gate; nothing it
# produces is imported into a shipping image or named by a production manifest. It is under the same
# licence review as anything else that enters the tree - see docs/DEPENDENCY_POLICY.md.
source = "https://github.com/KhronosGroup/Vulkan-Loader"
revision = "vulkan-sdk-1.4.357.0"
commit = "5f157b62e333c63260d05d81bf66faa216ab0fb8"
archive_sha256 = "54f2537df22313768da0317dda2abdaaab7711b4081c48c869a79db343d0ae70"
# THE ONE TERM THIS PROJECT TAKES IT UNDER, and the closure that term has to cover. Apache-2.0 is the
# majority; the deviations upstream calls "more permissive" are enumerated rather than waved at,
# because a licensing check that does not name them is a rubber stamp.
licence = "Apache-2.0"
licence_closure = ["Apache-2.0", "MIT", "HPND-Kevlin-Henney", "CC-BY-4.0"]
# MIT covers cJSON.c/.h and loader_json.c/.h; HPND-Kevlin-Henney covers dirent_on_windows.c/.h, which
# is outside this configuration's closure and is recorded because it is in the directory;
# CC-BY-4.0 covers documentation only and is outside the build closure entirely.

[upstream.vulkan-headers]
# A SEPARATELY VERSIONED REPOSITORY AND A REQUIRED BUILD DEPENDENCY. A pin naming only the loader
# does not identify a buildable configuration.
source = "https://github.com/KhronosGroup/Vulkan-Headers"
revision = "vulkan-sdk-1.4.357.0"
commit = "e3b1eec08173d6b825cd3ac88c885a63b621504a"
archive_sha256 = "e87dce08116151f6b6d7de6b6faf41498e87e6cf848ff16fa3bd5402190ad4a3"
licence = "Apache-2.0"
# The compatibility statement this part exists to record: the loader revision above builds against
# this header revision. Both carry the same SDK tag, which is what makes that statement checkable
# rather than asserted.
builds_against = true

[options]
# THE CMAKE OPTION SET IN FULL, WITH ITS VALUES. A configuration with some of its options chosen is
# not one pinned configuration, and every later branch in this milestone - the ABI inventory, the
# lifecycle set, the TLS variant, the symbol surface - is derived from this closure.
#
# AND THE BUILDER IS HELD TO IT (2026-10-15). `build-foreign-static.sh` compiles without CMake, so
# what these values mean is what the pinned revision's own CMake would do with them, and it checks
# that before it compiles anything: every option named here must be one the pinned revision has; an
# option with a compile-time effect must have exactly that effect - its define or flag present when
# ON, absent when OFF; and an option the revision does not have is recorded "absent", never given a
# value. Three were given one and are corrected below.
BUILD_TESTS = "OFF"                # the only reason C++17 would be required
BUILD_WSI_XCB_SUPPORT = "OFF"      # LiberSystem is none of these window systems, and they
BUILD_WSI_XLIB_SUPPORT = "OFF"     #   are what pull in X11/Wayland/XCB
BUILD_WSI_WAYLAND_SUPPORT = "OFF"
BUILD_WSI_DIRECTFB_SUPPORT = "OFF"
# ABSENT, NOT OFF (corrected 2026-10-15): this revision has no such option - QNX is not built
# through its CMake at all - and a value recorded for an option that does not exist is a guess.
BUILD_WSI_SCREEN_QNX_SUPPORT = "absent"
# ABSENT, NOT OFF (corrected 2026-10-15): assembly in this revision is `USE_GAS` on the Unix
# platforms and `USE_MASM` on Windows, both pinned OFF below. The decision this line recorded - no
# per-architecture asm, with its own relocation forms, in the one thing this milestone measures -
# stands; it is those two options that carry it.
LOADER_ENABLE_ASSEMBLY = "absent"
LOADER_ENABLE_ADDRESS_SANITIZER = "OFF" # and every other sanitizer: they add a runtime this
LOADER_ENABLE_THREAD_SANITIZER = "OFF"  #   system does not have
# ABSENT, NOT OFF (corrected 2026-10-15): this revision gives undefined-behaviour checking no option of
# its own - it comes with LOADER_ENABLE_ADDRESS_SANITIZER as `-fsanitize=address,undefined`, which
# is OFF above.
LOADER_ENABLE_UNDEFINED_BEHAVIOR_SANITIZER = "absent"
BUILD_WERROR = "OFF"                                  # upstream warnings are not this milestone's to fix
ENABLE_WIN10_ONECORE = "OFF"                          # not this platform
USE_GAS = "OFF"                                       # no per-architecture assembly, see above
USE_MASM = "OFF"
LOADER_USE_UNSAFE_FILE_SEARCH = "OFF"                 # the ambient-file search the discovery item replaces
LOADER_CODEGEN = "OFF"                                # see [generated_sources]: they are vendored upstream
CMAKE_INSTALL_PREFIX = "run-private"                  # nothing is installed into a system location
# CMAKE_BUILD_TYPE IS NOT AN OPTION OF THIS CONFIGURATION ANY MORE, and [build] below says why.

# THE STATIC LOADER IS NOT OBTAINED FROM `BUILD_STATIC_LOADER`, which is an Apple-only option
# upstream and is made to fail elsewhere. A portable static target is its own deliverable and is
# pinned by the STATIC-TARGET part, not here.
[options.static_loader]
mechanism = "portable-static-target"
build_static_loader = "unusable: APPLE_STATIC_LOADER upstream, non-Apple use fails"

[generated_sources]
# THE POLICY, ANSWERED: the registry-generated sources are VENDORED in the upstream archive at
# loader/generated/ rather than generated during the audit build. That is the more reproducible of
# the two answers the policy allows - a generated source that is not pinned makes the inventory
# unreproducible - and it is why LOADER_CODEGEN is OFF above.
policy = "vendored-in-upstream-archive"
path = "loader/generated"
files = [
	"vk_layer_dispatch_table.h",
	"vk_loader_extensions.c",
	"vk_loader_extensions.h",
	"vk_object_types.h",
]
# THE TREE DIGEST OF `loader/generated` AS THE ARCHIVE UNPACKS IT - every file's own digest and path,
# in path order - and the builder recomputes it on the tree it is about to compile and refuses to
# compile when it differs (2026-10-15; until then nothing read it).
digest = "c7ed63a3a928518bfbf2ffe824a7649433fc123cee5872a856f215beeb225fba"

[build]
# THE ONE CONFIGURATION THAT IS COMPILED, LINKED AND MEASURED, and the builder reads it from here.
#
# CORRECTED 2026-10-15. This part used to name two CMake build types - `Debug` for pass 1's inventory
# and `Release` for the production closure, Release authoritative where they disagree - and the
# builder compiled neither: one configuration at -O2 with `NDEBUG` undefined and no debug
# information, which every inventory, the audit link, both quarantine consumers and every guest run
# were taken on. The pin now says what was built, and the two it used to name are MEASURED against
# it rather than claimed:
#
#   Debug  (-O0 -g)           the same 52 symbols on all three targets. Nothing is lost by
#                               measuring on the configuration that is built.
#   Release (-O3 -DNDEBUG)    51: the same set less `__liber_assert_failed`, on all three targets.
#                               With `NDEBUG` defined the profile sysroot's `assert` expands to
#                               nothing, and that is the one symbol it reached.
#
# ASSERTIONS STAY LIVE because what this configuration produces is run - in a guest, as the loader a
# test drives - and an upstream assertion that fails there must stop the process through the
# substrate's `__liber_assert_failed`, which diverges, rather than continue past it. The substrate
# therefore provides that symbol, the converged link resolves it, and the quarantine facility probe
# resolves it too. A production import built as Release is the importing milestone's, and the
# exact-surface rule takes the symbol out of the substrate there.
#
# Reproduce either measurement with `build-foreign-static.sh --build-type debug|release`.
optimisation = "-O2"
assertions = "live"  # `NDEBUG` is not defined
debug_info = "none"  # no `-g`

[toolchain]
# THE TOOLS THAT RUN, BY THE VERSION LINE EACH PRINTS, and the builds read them from here: the
# builder refuses a compiler or an archiver whose line differs, and the audit link refuses a linker
# whose line differs. The flags live in `profile-abi.sh`, which the static-target part digests;
# naming them twice is two descriptions of one ABI.
#
# CORRECTED 2026-10-15. The linker was recorded as `ld.lld`, and nothing links with it: the audit link
# and both quarantine consumers are linked by the `rust-lld` of the toolchain the repository root
# selects, which is also what the image build links every foreign artifact with - so that is what is
# pinned. The version was recorded without the package revision clang actually prints, so nothing
# could compare it; it is the whole line now. `clang++` and `llvm-ranlib` stood here and nothing
# runs either: `llvm-ar`'s `s` modifier writes the symbol index, and `clang++` only compiles the
# forbidden-mechanism gate's mutation fixtures, which build nothing. The cross files below still name
# `ld.lld`, inertly - no CMake build reads them; what they are checked for is the ABI they describe.
compiler = "clang"
compiler_version = "Debian clang version 19.1.7 (3+b1)"
archiver = "llvm-ar"
archiver_version = "Debian LLVM version 19.1.7"
linker = "rust-lld"
linker_version = "LLD 21.1.8 (/checkout/src/llvm-project/llvm 85a90d119deb25b518867cd37d62c7b93b575a6f) (compatible with GNU linkers)"

[cross_files]
# ONE PER TARGET, each with its digest. Without these CMake compiles for the HOST, and that failure
# is silent: the build succeeds and the inventory describes a system this one is not.
#
# NO BUILD RUNS CMAKE, so what makes these more than a description is a check: the builder requires
# each file's target and ABI flags to be exactly the ones `profile-abi.sh` hands the compile
# (2026-10-15). Two descriptions of one ABI may exist; two that disagree may not.
x86_64 = { path = "src/foreign/cross/x86_64.cmake", target = "x86_64-unknown-none-elf", sha256 = "1455edd9d7c907245db141a8ef9a9d17f2e654437350203fe9524e89cf3b3a24" }
# REFROZEN 2026-09-11, and the reason is recorded rather than left as a changed number. The first
# version of this file declared `-mgeneral-regs-only`, on the assumption that a freestanding aarch64
# target must be soft-float. That was a SECOND description of an ABI the Rust half already fixes -
# `aarch64-unknown-none` reports `target_feature="neon"` - and it is exactly the failure the cross
# file's own header warns about. It surfaced as the pinned sources refusing to compile: cJSON uses
# `double`, which the ABI this file had declared cannot pass.
aarch64 = { path = "src/foreign/cross/aarch64.cmake", target = "aarch64-unknown-none", sha256 = "10fc6e0cb90aa5c5ad01fde6bb6a09ece3de77cb752fb1d4e98a1dc7f692c551" }
riscv64 = { path = "src/foreign/cross/riscv64.cmake", target = "riscv64-unknown-none-elf", sha256 = "bbc9c2c7236f93b937d260558c115ede5f52199a38ebde7300569538b51b0f18" }

[bootstrap_sysroot]
# SIZED BY THE OPTION SET, NOT BY THE INVENTORY - which is what keeps this part free of a cycle. It
# is NOT the profile sysroot, and it is NOT a libc: see its own README.
#
# REFROZEN 2026-09-11, for a README change and nothing else. The profile sysroot now exists, so this
# one-s README says where it is and what the difference between them is; no header moved, which is
# what the archives prove independently - they reproduce bit for bit under both sysroots.
# REFROZEN 2026-10-19, for a README change and nothing else: it names the profile it serves rather than
# a planning identifier. No header moved.
path = "src/foreign/bootstrap-sysroot"
digest = "9851480c1421eea977bf9d43cee1ff472a5e961d42094b7ca46e16d72d59002c"
headers = [
	"alloca.h",
	"assert.h",
	"ctype.h",
	"dirent.h",
	"dlfcn.h",
	"errno.h",
	"fcntl.h",
	"inttypes.h",
	"libgen.h",
	"math.h",
	"stdio.h",
	"stdlib.h",
	"string.h",
	"sys/stat.h",
	"sys/types.h",
	"unistd.h",
]
# The compiler's own freestanding headers are deliberately NOT restated here; `-nostdlibinc` keeps
# them reachable because they describe the TARGET rather than the host.

[gate]
# WHAT THIS PART CLAIMS, AND THE EVIDENCE FOR IT. The three files and the sysroot exist, each
# digested above, and a compile of the pinned configuration reaches a diagnostic from the SOURCES
# rather than a missing-header error, on all three targets.
compile_probe = "loader/cJSON.c"
missing_header_errors = 0
source_diagnostic = "vk_loader_platform.h:248: use of undeclared identifier 'DIRECTORY_SYMBOL'"
# THAT DIAGNOSTIC IS THE CORRECT RESULT AND NOT A FAILURE. It is the loader saying its platform port
# is missing - which is a later deliverable of this milestone - and reaching it proves the headers
# resolved, the target ABI was the cross file's rather than the host's, and the compile stopped in
# the upstream sources.
targets_proven = ["x86_64-unknown-none-elf", "aarch64-unknown-none", "riscv64-unknown-none-elf"]
