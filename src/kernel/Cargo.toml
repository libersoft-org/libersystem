[package]
name = "kernel"
# The product version is the single source of truth in /product.conf (surfaced at
# runtime via build.rs -> env!("PRODUCT_VERSION")); Cargo's optional package
# version is unused here and omitted.
edition = "2024"
description = "OS kernel"

[[bin]]
name = "kernel"
path = "main.rs"

[dependencies]
# The typed boot protocol the own UEFI loader hands the kernel (memory map, HHDM
# offset, framebuffer, loaded packages, ACPI RSDP).
bootproto = { path = "../boot/protocol" }
# Shared kernel/userspace ABI constants (syscalls, errors, rights, package format).
abi = { path = "../abi" }
# THE DRIVER BRING-UP WIRE, for the test suites only in spirit but declared here because the kernel
# has one dependency list. Two of its hardware suites spawn a REAL userspace driver and stand in for
# DeviceManager while it comes up, so they have to speak the same handshake DeviceManager speaks -
# and speaking it from a hand-written copy of the frame layout is how the two would drift.
driver-protocol = { path = "../user/libs/driver/protocol" }
# The physical-frame buddy allocator. It is pure bitmap arithmetic, so it lives in a crate a host
# can drive tens of millions of operations through - which is what the one unexplained
# double allocation needed and could never get from a guest boot.
buddy = { path = "../buddy" }
# The flattened device tree reader, shared with the loader. It was `arch::common::dtb`; moving it
# out is what let a real QEMU device tree be handed to it on a host, which immediately found that
# `timebase_frequency` had never once returned a value.
fdt = { path = "../fdt" }
# The DMA/IOVA contract and the IOMMU backend interface. In a crate for the same reason `buddy` is:
# every rule in it is about an operation that did NOT complete - a refused unmap, an invalidation
# nobody confirmed - and a host can drive every one of those orders where a booted kernel with an
# emulated IOMMU cannot.
dma = { path = "../dma" }
# Firmware memory and CPU affinity, normalized and validated. In a crate for the same reason `buddy`
# is: the interesting cases are tables that are wrong - a truncated SRAT, a matrix that is not square,
# two nodes claiming one page - and a host can produce every one of them where QEMU can produce none.
topology = { path = "../topology" }
# The secondary-CPU start rules: which logical id a core is offered, and for how long it keeps it.
# In a crate for the same reason `buddy` is - the cases that matter are a refused firmware call, a
# core released late, a tree that forgot the core reading it, and QEMU has a switch for none of them.
smpboot = { path = "../smpboot" }
# LiberFS, for the test suite only: the storage scenarios hand StorageService a disk, and since
# the factory archive was retired that disk has to carry a real filesystem rather than a
# package to make one from. Building the fixture with the same crate the service mounts means the
# test cannot drift from the format it is testing against.
liberfs = { path = "../fs/liberfs" }
# The disk probe, for the test suite only: the storage scenarios build partition tables for
# StorageService to read, and building them with the same crate that reads them is what keeps
# the fixture and the format from drifting (the checksums especially).
partition = { path = "../fs/partition" }
fscore = { path = "../fs/core" }
# The shared terminal stack (grid model + framebuffer renderer): the boot console and
# the ConsoleService renderer are the same `term::Term`, so there is one renderer.
term = { path = "../term" }

# abi is also a build-dependency so build.rs packs with the same constants.
[build-dependencies]
abi = { path = "../abi" }
bootproto = { path = "../boot/protocol" }
system-manifest = { path = "../tools/system-manifest" }

[dev-dependencies]
# The audio leaves, for the `audioconv` scenario: the test builds its own input with the WAV
# encoder and decodes what came back with the decoder of whichever format was written, so the
# assertion is against samples rather than against a byte count.
aiff = { path = "../user/libs/audio/aiff" }
flac = { path = "../user/libs/audio/flac" }
pcm = { path = "../user/libs/audio/pcm" }
wav = { path = "../user/libs/audio/wav" }
wavpack = { path = "../user/libs/audio/wavpack" }
# The audioconv scenario reads back what the tool wrote, and the lossy destination is read by the
# same decoder a player would use rather than by a parser written for the test.
vorbis = { path = "../user/libs/audio/vorbis" }
mp3 = { path = "../user/libs/audio/mp3" }

bmp = { path = "../user/libs/image/bmp" }
gif = { path = "../user/libs/image/gif" }
pix = { path = "../user/libs/image/pix" }
png = { path = "../user/libs/image/png" }
tga = { path = "../user/libs/image/tga" }
webp = { path = "../user/libs/image/webp" }

# Note: the x86_64-unknown-none target is panic-strategy = "abort" by default, so
# we deliberately do NOT set `panic = "abort"` per-profile. Doing so makes cargo
# pass `-C panic=abort` for normal builds while the (ignored) test profile omits
# it, which builds `core` twice with different hashes and breaks `cargo test`
# with a duplicate-lang-item error.

# NO `[profile.dev.package.compiler_builtins]` OVERRIDE, and the reason is measured rather than
# assumed. One stood here turning off debug-assertions and overflow-checks for `compiler_builtins`,
# with a comment saying the `compiler-builtins-mem` intrinsics would otherwise abort the kernel on a
# 16-byte move and that the override was therefore load-bearing. Cargo answered every build with
# "profile package spec `compiler_builtins` in profile `dev` did not match any packages" - which is
# cargo saying it applied nothing. It was removed and the full x86_64 suite passed: 305 of 305. The
# override was not load-bearing; it was not in effect at all, and the line it printed on every build
# was the only thing it did.
[profile.release]
lto = true

# A WARNING IS AN ERROR HERE. A sweep took ninety-one `allow` attributes out of this tree and found
# a hundred and twenty warnings underneath them - a duplicate register read a driver was told to
# call, a field whose comment said it kept a DMA buffer alive and which nothing read, a HAL entry
# all three backends declared and none called. None of that was reported, because the reporting had
# been switched off file by file over years, unevenly, and nobody had decided it.
#
# `[lints]` rather than `RUSTFLAGS`: this denies in THIS package only. RUSTFLAGS would deny inside
# `build-std`'s `core` and `compiler_builtins` too, where a warning is not ours to answer.
[lints.rust]
warnings = "deny"
