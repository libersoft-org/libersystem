# THE POWER BUTTON ON THE CHASSIS, WHICH NOTHING INSIDE THE GUEST CAN PRESS.
#
# This is the fixture the ACPI fixed-hardware item said it needed and did not have: "a QEMU machine
# whose PM1a event can be raised on demand". `system_powerdown` on the monitor is exactly that - it
# sets PWRBTN_STS in the PM1a status register and raises the SCI - and until a scenario could send a
# monitor command there was no way to ask for it.
#
# WHAT IT ASSERTS IS THE WHOLE CHAIN AND NOT THE END OF IT. The kernel has to have read the FADT,
# routed the SCI through the I/O APIC as a level-triggered active-low line, entered ACPI mode,
# armed PWRBTN_EN, and then decoded and acknowledged the status bit - and every one of those is
# silent when wrong. A machine that did none of them boots identically and answers this command by
# doing nothing at all.
#
# AND THEN THE PROVIDER: the kernel declares the fixed button as a claimable row, the `acpi-button`
# driver holds it and publishes a `platform-switch`, the power-state policy follows it, DeviceManager
# hands the press to that driver, the driver tells the policy, and the policy powers the machine off
# IN ORDER - ServiceManager's sequence through `system-shutdown`, every service stopped, then `\_S5`.
#
# THE VACUITY GUARD IS THAT THE LINES ONLY EXIST AFTER A PRESS. Nothing prints them at boot: the
# kernel's is written by the handler, from the interrupt, with the status bit in hand, and each later
# one by the step before it.
#
# ONE ASSERTION PER HALF. The kernel's line says the SCI arrived and was decoded; DeviceManager's that
# the typed event reached the binding; the driver's that it reached the policy; the policy's what it
# decided; ServiceManager's and the kernel's last two that the decision was carried out in order. A
# gate with only the last cannot tell which half did nothing.
version = 1
name = "power button"
# AND IT ENDS WITH THE MACHINE OFF, WHICH IS THE ASSERTION AND NOT AN ACCIDENT. Every other scenario
# gives its scope back by driving the guest afterwards - a keystroke, a prompt, a reset - and there is
# nothing here to drive. The teardown asserts the opposite instead: that nothing answers any more.
ends = "powered-off"
description = "The chassis power button raises an SCI the kernel decodes and reports, its driver tells the power-state policy, and the machine powers off in order."
timeout = 300

[[step]]
do = "prompt"
timeout = 120

[[step]]
do = "monitor"
command = "system_powerdown"
timeout = 30

[[step]]
do = "expect"
contains = "acpi: the power button was pressed"
timeout = 60

# THE BINDING THAT HOLDS THE BUTTON'S ROW AND THE POLICY THAT FOLLOWS ITS PROVIDER are both in place by the prompt -
# their lines come before the shell's, which is where a scenario's reading starts - and these two lines are what says
# so: DeviceManager hands a press only to an online binding, and the driver tells the policy only through a stream the
# policy opened. A press either did not reach would be acted on by DeviceManager or the driver alone, and say that.
[[step]]
do = "expect"
contains = "DeviceManager: the power button was pressed - handed to the driver that holds it"
timeout = 60

[[step]]
do = "expect"
contains = "driver.acpi-button: kernel:pwrbtn: pressed - told the power-state policy"
timeout = 30

[[step]]
do = "expect"
contains = "PowerService: sleep policy: the power button was pressed - it powers off in order"
timeout = 30

[[step]]
do = "expect"
contains = "supervisor: system-shutdown asked for the orderly power-off"
timeout = 30

[[step]]
do = "expect"
contains = "power-off: the registered \\_S5"
timeout = 120
