# A HARD RESET THROUGH THE BMC, confirmed on the protected screen: the machine stops at once and boots again.
#
# The oracle is durable - the run has no `-no-reboot`, so the reset is a second boot on the serial log, which
# `check-ipmi-admin.sh` counts. One simulated BMC on ISA KCS. Run bare there is no BMC, and the first wait fails.
version = 1
name = "ipmi hard reset"
description = "A BMC hard reset, confirmed on the protected screen, resets the machine: a second boot follows."
timeout = 900

[[step]]
do = "prompt"
timeout = 180

[[step]]
do = "key"
text = "bmccheck booted"

[[step]]
do = "expect"
contains = "bmccheck: the boot's event is in the log of bmc:"
timeout = 200

[[step]]
do = "prompt"

[[step]]
do = "key"
text = "bmc chassis hard-reset &"

[[step]]
do = "expect"
contains = " - confirm it on the protected screen"

[[step]]
do = "key"
keys = ["ctrl-alt-f12"]

[[step]]
do = "expect"
contains = "AdminService: the protected screen is presented, and a request is waiting"

[[step]]
do = "expect"
contains = "AdminService: the session is ready for a decision"

[[step]]
do = "key"
keys = ["ret"]

# THE EXECUTOR REACHED: what the driver says next may never leave the machine it stops, so the oracle follows.
[[step]]
do = "expect"
contains = "AdminService: request 1 consumed"
timeout = 60

# THE SECOND BOOT.
[[step]]
do = "expect"
contains = "BmcService: online"
timeout = 300

[[step]]
do = "prompt"
timeout = 300
