[package]
name = "proto"
# The product version lives only in /product.conf; Cargo's optional package
# version is unused here and omitted.
edition = "2024"
description = "Generated LSIDL bindings (wire codec, clients, servers) for LiberSystem"

[features]
default = []
# THE FACADE'S FEATURE HAS TO SELECT THE DOMAINS' FEATURES, because Cargo features are per package.
#
# This was `["dep:ipc-client"]` and nothing else. Enabling it therefore pulled in the optional
# dependency and selected the same-named feature in exactly none of the fifteen crates whose
# generated wrappers it is named after - so `cargo check --features channel-client-impl` succeeded
# while compiling not one `liber_channel_impl_*` symbol, and the mismatch surfaced at a link far
# away from the manifest that caused it. `shared-image` was unaffected because it propagates
# `X/shared-image` per domain and each of those enables its own `channel-client-impl`; that is the
# pattern, and this is it written out for the narrow feature too.
#
# `base-proto` is absent deliberately: it declares no channel methods, so it has no such feature.
channel-client-impl = [
	"audio-proto/channel-client-impl",
	"config-proto/channel-client-impl",
	"dep:ipc-client",
	"device-proto/channel-client-impl",
	"display-proto/channel-client-impl",
	"input-proto/channel-client-impl",
	"log-proto/channel-client-impl",
	"network-proto/channel-client-impl",
	"observability-proto/channel-client-impl",
	"process-proto/channel-client-impl",
	"resources-proto/channel-client-impl",
	"security-proto/channel-client-impl",
	"session-proto/channel-client-impl",
	"storage-proto/channel-client-impl",
	"time-proto/channel-client-impl",
]
shared-image = [
	"audio-proto/shared-image",
	"channel-client-impl",
	"config-proto/shared-image",
	"device-proto/shared-image",
	"display-proto/shared-image",
	"input-proto/shared-image",
	"ipc-client/shared-image",
	"log-proto/shared-image",
	"network-proto/shared-image",
	"observability-proto/shared-image",
	"process-proto/shared-image",
	"resources-proto/shared-image",
	"security-proto/shared-image",
	"session-proto/shared-image",
	"storage-proto/shared-image",
	"time-proto/shared-image",
]

[dev-dependencies]
# The OWNER of the log wire format, so the golden test compares the generated codec against it
# rather than against a third hand-typed copy of the same bytes. A dev-dependency: nothing shipped
# links `abi` through `proto`.
abi = { path = "../abi" }

[dependencies]
audio-proto = { path = "../user/libs/protocol/audio-proto" }
base-proto = { path = "../user/libs/protocol/base-proto" }
config-proto = { path = "../user/libs/protocol/config-proto" }
device-proto = { path = "../user/libs/protocol/device-proto" }
display-proto = { path = "../user/libs/protocol/display-proto" }
input-proto = { path = "../user/libs/protocol/input-proto" }
log-proto = { path = "../user/libs/protocol/log-proto" }
network-proto = { path = "../user/libs/protocol/network-proto" }
observability-proto = { path = "../user/libs/protocol/observability-proto" }
process-proto = { path = "../user/libs/protocol/process-proto" }
resources-proto = { path = "../user/libs/protocol/resources-proto" }
security-proto = { path = "../user/libs/protocol/security-proto" }
session-proto = { path = "../user/libs/protocol/session-proto" }
storage-proto = { path = "../user/libs/protocol/storage-proto" }
time-proto = { path = "../user/libs/protocol/time-proto" }
wire = { path = "../wire" }
ipc-client = { path = "../user/libs/ipc/ipc-client", optional = true }
