[build]
target = "x86_64-unknown-uefi"
target-dir = "../../../.build/cargo/loader"

# THE CURVE BACKEND, CHOSEN RATHER THAN GUESSED AT. `curve25519-dalek` picks a SIMD backend on a
# nightly compiler and that backend stops this target's build dead - "rustc-LLVM ERROR: Do not know
# how to split the result of this operator!" - because a UEFI application has no AVX2 to lower it
# onto. The serial backend is the portable one and is what every other target here already gets.
#
# PER TARGET, not `[build] rustflags`: this is one dependency's build knob, and a flag set for every
# target would also reach `build-std`'s `core`, where a setting of ours is not ours to make.
[target.x86_64-unknown-uefi]
rustflags = ['--cfg', 'curve25519_dalek_backend="serial"']

[unstable]
# `alloc` is built because the loader now links the filesystem crates, and LiberFS is not
# allocation-free: a directory walk and a file read are sized at runtime. The loader supplies the
# allocator itself (see `heap.rs`), backed by firmware pages and retired at ExitBootServices.
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
