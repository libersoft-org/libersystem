[package]
name = "loader"
# The product version lives only in /product.conf; Cargo's optional package
# version is unused here and omitted.
edition = "2024"
description = "LiberSystem UEFI boot loader (x86_64, aarch64 and riscv64 EFI application)"

build = "build.rs"

[[bin]]
name = "libersystem-loader"
path = "src/main.rs"

[dependencies]
bootproto = { path = "../protocol" }
# Ed25519 verification for the signed boot manifest, in its own crate so `bootproto` - which the
# KERNEL also links - stays dependency-free and never compiles any of it.
bootsig = { path = "../signature" }
# The UEFI bindings and the firmware-facing algorithms, in a crate that can be host-tested against a
# mock firmware. Nothing inside a UEFI binary can be, which is why they are not here.
uefi = { path = "../uefi" }
# The flattened device tree, shared with the kernel's device-tree backends. The loader reads it for
# one thing: `/chosen/stdout-path`, which is where the post-ExitBootServices console address comes
# from now that it is no longer a literal copied from QEMU.
fdt = { path = "../../fdt" }

# The filesystem crates, linked read-only. The loader supplies a BlockDevice over the firmware's
# disk protocol and these read the volume above it - the same code the storage service runs after
# ExitBootServices, rather than a second implementation of the same formats.
fscore = { path = "../../fs/core" }
# The package archive constants, so the archive the loader assembles in memory is the one the
# kernel already knows how to read - shared constants rather than a second copy of the format.
abi = { path = "../../abi" }
liberfs = { path = "../../fs/liberfs" }
# FAT, read-only. The firmware mounts the ESP for us through Simple File System, so this is not
# how the loader reads its own boot volume - it is how it reads a FAT medium the firmware will
# NOT mount, which is what an installer or rescue stick on unusual firmware looks like.
fat = { path = "../../fs/fat" }

# The dev build optimizes the filesystem crates for the same reason the storage service does:
# LiberFS verifies a CRC32C per block it reads, and an unoptimized checksum is the whole cost of
# reading the kernel here.
[profile.dev.package.liberfs]
opt-level = 2

[profile.dev.package.fat]
opt-level = 2

# AND THE HASHES, WHICH WERE MOST OF AN EMULATED BOOT. The loader proves the kernel and the volume package
# against the signed manifest before it hands either over, and at opt-level 0 the SHA-256 that does it -
# `bootproto`'s, the one the kernel already builds at opt-level 3 - was the longest thing it did: on riscv64
# under TCG, 172 s for the kernel and 187 s for the volume package of a 388 s loader (timestamped serial,
# 2026-10-12), which is what ran the ports' boot gates out of their budget. The manifest's Ed25519 check and
# its SHA-512 come with it. The checks are unchanged; they are compiled.
[profile.dev.package.bootproto]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 2

[profile.dev.package.bootsig]
opt-level = 2

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# A WARNING IS AN ERROR HERE. A sweep took ninety-one `allow` attributes out of this tree and found
# a hundred and twenty warnings underneath them - a duplicate register read a driver was told to
# call, a field whose comment said it kept a DMA buffer alive and which nothing read, a HAL entry
# all three backends declared and none called. None of that was reported, because the reporting had
# been switched off file by file over years, unevenly, and nobody had decided it.
#
# `[lints]` rather than `RUSTFLAGS`: this denies in THIS package only. RUSTFLAGS would deny inside
# `build-std`'s `core` and `compiler_builtins` too, where a warning is not ours to answer.
[lints.rust]
warnings = "deny"
