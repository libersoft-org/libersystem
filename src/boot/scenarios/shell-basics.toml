# The shell answers on the terminal the control channel types into.
#
# This is the shape an application scenario takes: typed steps with typed fields, deadlines
# on each and on the whole, and no way to express "run this string in a shell" - the input is
# characters going to a terminal, which is what a person driving the guest actually does.
version = 1
name = "shell basics"
description = "The guest shell reads terminal input from the control channel and answers on the console."
timeout = 120

[[step]]
do = "prompt"
timeout = 30

# EVERY MARKER BELOW IS ABSENT FROM THE INPUT THAT PRODUCES IT.
#
# This scenario used to type `echo scenario-one` and then look for `scenario-one`. The terminal
# echoes what is typed, so that string was on the console before the shell did anything at all: the
# assertion passed on the echo of its own command line, and would have gone on passing with the
# shell's command execution removed entirely. It is the exact shape of a test that reports success
# without measuring its subject.
#
# `uname` and `ls` are used instead, because what they print appears nowhere in what is typed.

[[step]]
do = "input"
text = "uname"

[[step]]
do = "expect"
contains = "LiberSystem"
timeout = 20

# A command with an argument, whose answer is a filename the input does not contain.
[[step]]
do = "input"
text = "ls vol://system/lib/protocol"

[[step]]
do = "expect"
contains = "base-proto.lslib"
timeout = 20
