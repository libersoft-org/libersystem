time-client = { path = "../../libs/clients/time-client", optional = true }
time-client-provider = { path = "../../libs/clients/time-client-provider", optional = true }
volume-client = { path = "../../libs/clients/volume-client" }
volume-client-provider = { path = "../../libs/clients/volume-client-provider" }

bmp = { path = "../../libs/image/bmp" }
keys = { path = "../../libs/input/keys" }
lico = { path = "../../libs/terminal/lico" }
imgconv = { path = "../../libs/image/imgconv" }
audioconv = { path = "../../libs/audio/audioconv" }
