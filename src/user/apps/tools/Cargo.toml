[features]
default = []
shared-image = [
	"ipc-client/shared-image",
	"audio-client/shared-image",
	"audio-client-provider/shared-image",
	"config-client/shared-image",
	"config-client-provider/shared-image",
	"device-client/shared-image",
	"device-client-provider/shared-image",
	"log-client/shared-image",
	"log-client-provider/shared-image",
	"network-client/shared-image",
	"network-client-provider/shared-image",
	"observability-client/shared-image",
	"observability-client-provider/shared-image",
	"process-client/shared-image",
	"process-client-provider/shared-image",
	"resources-client/shared-image",
	"resources-client-provider/shared-image",
	"security-client/shared-image",
	"security-client-provider/shared-image",
	"session-client/shared-image",
	"session-client-provider/shared-image",
	"time-client/shared-image",
	"time-client-provider/shared-image",
	"volume-client/shared-image",
	"volume-client-provider/shared-image",
	"proto/shared-image",
	"rt/shared-image",
	"storage-proto/shared-image",
	"lico/shared-image",
]

[dependencies]
# The bounded command-line primitives: argument, size and range parsing, the glob matcher and the
# chunk-at-a-time streaming vocabulary. Pure, so it is host-tested; see `user/libs/cli`.
cli = { path = "../../libs/command/cli" }
# The executable-name rules `which` resolves with, shared with the shell and the launcher so the
# three cannot disagree about what artifact a command word names.
service-logic = { path = "../../services/logic" }
# The session client `kill` asks to signal a job through - the narrow one, which cannot take a
# job's Process handle.
session-client = { path = "../../libs/clients/session-client" }
session-client-provider = { path = "../../libs/clients/session-client-provider" }
ipc-client = { path = "../../libs/ipc/ipc-client" }
# Shared ring-3 userspace runtime (entry stub, syscall wrapper, panic handler, and
# the syscall/IPC helpers); it re-exports the abi constants.
rt = { path = "../../runtime/rt" }

# Generated LSIDL bindings: the net tools speak the NetworkService contracts
# (`network` / `socket`) via the proto codec + generated clients.
proto = { path = "../../../proto" }
storage-proto = { path = "../../libs/protocol/storage-proto", features = ["channel-client-impl"] }
audio-client = { path = "../../libs/clients/audio-client", optional = true }
audio-client-provider = { path = "../../libs/clients/audio-client-provider", optional = true }
network-client = { path = "../../libs/clients/network-client", optional = true }
network-client-provider = { path = "../../libs/clients/network-client-provider", optional = true }
config-client = { path = "../../libs/clients/config-client", optional = true }
config-client-provider = { path = "../../libs/clients/config-client-provider", optional = true }
device-client = { path = "../../libs/clients/device-client", optional = true }
device-client-provider = { path = "../../libs/clients/device-client-provider", optional = true }
log-client = { path = "../../libs/clients/log-client", optional = true }
log-client-provider = { path = "../../libs/clients/log-client-provider", optional = true }
observability-client = { path = "../../libs/clients/observability-client", optional = true }
observability-client-provider = { path = "../../libs/clients/observability-client-provider", optional = true }
process-client = { path = "../../libs/clients/process-client", optional = true }
process-client-provider = { path = "../../libs/clients/process-client-provider", optional = true }
resources-client = { path = "../../libs/clients/resources-client", optional = true }
resources-client-provider = { path = "../../libs/clients/resources-client-provider", optional = true }
security-client = { path = "../../libs/clients/security-client", optional = true }
