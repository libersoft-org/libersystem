[package]
# The product version lives only in /product.conf; Cargo's optional package
# version is unused here and omitted.
name = "service-logic"
edition = "2024"
description = "The pure decisions CoreServices makes, split out so they can be tested on the host"

# Split out of the `services` crate, and the reason is a testing one rather than an architectural
# one. `services` builds twenty-odd service binaries, every one of which links `rt` - the
# freestanding runtime that defines the `panic_impl` lang item. `cargo test` links `std`, which
# defines it too, so the whole crate failed with E0152 before a single test ran: four suites of pure
# logic that no host could execute, and whose only cover was a QEMU boot.
#
# Nothing here may depend on `rt`, on `ipc-client`, or on anything that reaches them. That is the
# entire contract of this crate, and it is what makes the suites runnable.

[dependencies]
# Shared kernel/userspace ABI constants: the executable suffix, and nothing else.
abi = { path = "../../../abi" }
# The error enum the component world's two hosts classify. `base-proto` reaches only `wire` and
# `abi`, so it does not breach the contract above - the `proto` facade would, through its optional
# `ipc-client`.
base-proto = { path = "../../libs/protocol/base-proto" }
# The dynamic-loader bounds the module graph is checked against.
bootproto = { path = "../../../boot/protocol" }
# The component world's outcome types, so the classification answers in the vocabulary the guest is
# actually told rather than in a private one both hosts would then have to translate.
wasm = { path = "../../../wasm" }

# A WARNING IS AN ERROR HERE. P02M0144 took ninety-one `allow` attributes out of this tree and found
# a hundred and twenty warnings underneath them - a duplicate register read a driver was told to
# call, a field whose comment said it kept a DMA buffer alive and which nothing read, a HAL entry
# all three backends declared and none called. None of that was reported, because the reporting had
# been switched off file by file over years, unevenly, and nobody had decided it.
#
# `[lints]` rather than `RUSTFLAGS`: this denies in THIS package only. RUSTFLAGS would deny inside
# `build-std`'s `core` and `compiler_builtins` too, where a warning is not ours to answer.
[lints.rust]
warnings = "deny"
