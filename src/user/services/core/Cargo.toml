[dependencies]
ipc-client = { path = "../../libs/ipc/ipc-client" }
# Shared ring-3 userspace runtime (entry stub, syscall wrapper, panic handler, and
# the syscall/IPC/volume helpers); it re-exports the abi constants.
rt = { path = "../../runtime/rt" }

# The pure decisions this service makes, in a crate that links no runtime - so `cargo test` can
# build and run their suites on the host. The split is a testing one: everything in this crate links
# `rt`, whose `panic_impl` collides with the `std` the test harness needs. See services/logic.
service-logic = { path = "../logic" }
# THE DRIVER LIBRARY'S STAGED DECODERS, for the one service that decodes what its providers deliver:
# MidiService turns USB-MIDI 1.0 packets into chunks with `drivers::usb_midi`, the same code the USB MIDI
# class module will hand its transfers to, so there is one decoder and not a second one here.
drivers = { path = "../../drivers/core" }

# Generated LSIDL bindings (the proto codec, clients, and servers) - LogService
# serves them and the shell + ServiceManager speak them over the log channel.
proto = { path = "../../../proto" }
# THE BRING-UP WIRE. The same crate the drivers speak, so the manager and the driver cannot drift:
# one frame format, one protocol version, one set of provider kinds.
driver-protocol = { path = "../../libs/driver/protocol" }
# WHERE A BINDING IS AND WHY, in a crate rather than a module: the record is read by five milestones,
# and a state table living inside a `no_std` binary is one nobody can drive on a host.
driver-binding = { path = "../../libs/driver/binding" }
# The bounded transferred-handle list the capability-aware receive answers with.
wire = { path = "../../../wire" }
storage-proto = { path = "../../libs/protocol/storage-proto" }
bootproto = { path = "../../../boot/protocol" }
# THE ANSWER-TO-RESET PARSER, which SmartcardService reads every card's ATR with before its decisions see what
# it offers. Linked statically, as `service-logic` is.
smartcard-model = { path = "../../libs/smartcard/model" }
abi = { path = "../../../abi" }

# The graphics-free terminal model (L2): the cell grid, escape parser, and text
# serialization that ConsoleService renders to the framebuffer.
term = { path = "../../../term" }

# The minimal WebAssembly runtime, used by the wasi_host component runner - and `wasm::world`, the
# host side of the component world (which imports are granted, and how a guest's `(ptr, len)`
# becomes a slice of its own memory). That lives there rather than here because this binary is
# built for `*-unknown-none` and cannot be tested on the host, and those two decisions are exactly
# the ones worth testing.
wasm = { path = "../../../wasm" }

# THE SHARED IMAGE MODEL. A mapped display surface arrives described by it, and the console's
# renderer is built from that description rather than from a second one assembled here.
graphics-core = { path = "../../libs/graphics/core" }
# THE TYPED DISPLAY-DEVICE WIRE, which DisplayService CALLS. It reaches the generated client through
# the aggregate as well, and naming it here is what lets the shared-image linker see the archive.
display-device-proto = { path = "../../libs/protocol/display-device-proto" }
# Shared pixel vocabulary and direct/scaled blitters. Kept as a separate crate so
# graphical applications and DisplayService use exactly the same geometry semantics.
pix = { path = "../../libs/image/pix" }
keys = { path = "../../libs/input/keys" }
# THE CANONICAL POWER MODEL, which PowerService checks every published record against and never
# converts with: the producers call its adapters, this service only asks whether they did.
power-model = { path = "../../libs/power/model" }
pcm = { path = "../../libs/audio/pcm" }
surface = { path = "../../libs/display/surface" }

[build-dependencies]
system-manifest = { path = "../../../tools/system-manifest" }

# Note: the x86_64-unknown-none target is panic-strategy = "abort" by default, so
# we do not set `panic = "abort"` per-profile (same reasoning as the kernel).

# Pixel loops are the display hot path; optimize this small dependency while keeping
# service control flow and symbols in the ordinary debuggable dev profile.
[profile.dev.package.pix]
opt-level = 2
# The parent dev profile still retains debug information.

# A WARNING IS AN ERROR HERE. A sweep took ninety-one `allow` attributes out of this tree and found
# a hundred and twenty warnings underneath them - a duplicate register read a driver was told to
# call, a field whose comment said it kept a DMA buffer alive and which nothing read, a HAL entry
# all three backends declared and none called. None of that was reported, because the reporting had
# been switched off file by file over years, unevenly, and nobody had decided it.
#
# `[lints]` rather than `RUSTFLAGS`: this denies in THIS package only. RUSTFLAGS would deny inside
# `build-std`'s `core` and `compiler_builtins` too, where a warning is not ours to answer.
[lints.rust]
warnings = "deny"
