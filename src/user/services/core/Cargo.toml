[package]
name = "services"
# The product version lives only in /product.conf; Cargo's optional package
# version is unused here and omitted. The services crate produces the userspace
# system services started across the boot chain (ServiceManager first), loaded
# from the init package.
edition = "2024"
build = "build.rs"
# EVERY BINARY IN THIS PACKAGE IS DECLARED BELOW, and cargo's auto-discovery is off so that stays
# true. A stray empty `src/main.rs` turned into an undeclared `services` binary with no `main` and
# no panic handler, and broke every `./build.sh` until it was found - a file nobody wrote being
# compiled because of where it sat.
autobins = false
description = "Core userspace system services (ServiceManager, ...)"

[features]
default = []
# The development agent, its artifact registry and the control port it is reached over.
# Deliberately not in `default`: a shipping build must not contain them at all.
development = []
shared-image = [
	"ipc-client/shared-image",
	"proto/shared-image",
	"rt/shared-image",
	"storage-proto/shared-image",
]

[[bin]]
name = "service_manager"
path = "src/service_manager.rs"

[[bin]]
name = "log_service"
path = "src/log_service.rs"

[[bin]]
name = "device_manager"
path = "src/device_manager.rs"

[[bin]]
name = "dev_agent"
path = "src/dev_agent.rs"
# Not built at all without the feature, so the development agent and the artifact registry
# behind it are absent from a shipped image rather than present and refusing to work.
required-features = ["development"]

[[bin]]
name = "device_service"
path = "src/device_service.rs"

[[bin]]
name = "process_service"
path = "src/process_service.rs"

[[bin]]
name = "config_service"
path = "src/config_service.rs"

[[bin]]
name = "network_service"
path = "src/network_service.rs"

[[bin]]
name = "console_service"
path = "src/console_service.rs"

[[bin]]
name = "display_service"
path = "src/display_service.rs"

[[bin]]
name = "font_catalogue"
path = "src/font_catalogue.rs"

[[bin]]
name = "bluetooth_bond_store"
path = "src/bluetooth_bond_store.rs"

[[bin]]
name = "bluetooth_service"
path = "src/bluetooth_service.rs"

[[bin]]
name = "power_service"
path = "src/power_service.rs"

[[bin]]
name = "smartcard_service"
path = "src/smartcard_service.rs"

[[bin]]
name = "modem_service"
path = "src/modem_service.rs"

[[bin]]
name = "camera_service"
path = "src/camera_service.rs"

[[bin]]
name = "midi_service"
path = "src/midi_service.rs"

[[bin]]
name = "spool_service"
path = "src/spool_service.rs"

[[bin]]
name = "media_import_service"
path = "src/media_import_service.rs"

[[bin]]
# THE TRUSTED ADMINISTRATIVE PATH: one person's confirmation, on a protected screen, of one bound
# high-risk operation, and at most one attempt at it.
name = "admin_service"
path = "src/admin_service.rs"

[[bin]]
# THE ADMINISTRATIVE-PATH GATE'S PROBES, absent from a shipped image: the requester and scenario driver, the
# second process that is handed another launch's endpoints, and an ordinary client that keeps trying to
# cover the protected screen.
name = "admincheck"
path = "src/admincheck.rs"
required-features = ["development"]

[[bin]]
name = "adminhelper"
path = "src/adminhelper.rs"
required-features = ["development"]

[[bin]]
name = "adminhostile"
path = "src/adminhostile.rs"
required-features = ["development"]

[[bin]]
# THE BLUETOOTH GATE'S SCENARIO DRIVER, absent from a shipped image: it holds the operator authority
# and talks to a fixture only a development image has.
name = "btcheck"
path = "src/btcheck.rs"
required-features = ["development"]

[[bin]]
# An ordinary Bluetooth read client, for the gate's denial check. Absent from a shipped image with the
# scenario driver.
name = "btread"
path = "src/btread.rs"
required-features = ["development"]

[[bin]]
# THE POWER GATE'S SCENARIO DRIVER, absent from a shipped image: it holds PowerService's control
# authority and the power fixture's control endpoint, which only a development image has.
name = "powercheck"
path = "src/powercheck.rs"
required-features = ["development"]

[[bin]]
# The power gate's ordinary read client, which holds the read authority and nothing else.
name = "powerread"
path = "src/powerread.rs"
required-features = ["development"]

[[bin]]
# THE SMART-CARD GATE'S SCENARIO DRIVER, absent from a shipped image: it holds the smart-card
# fixture's control endpoint, which only a development image has.
name = "cardcheck"
path = "src/cardcheck.rs"
required-features = ["development"]

[[bin]]
# The smart-card gate's second client: a queue, an inherited endpoint, a service killed mid-exchange.
name = "cardhold"
path = "src/cardhold.rs"
required-features = ["development"]

[[bin]]
# The smart-card gate's read-only client.
name = "cardread"
path = "src/cardread.rs"
required-features = ["development"]

[[bin]]
# The smart-card gate's client of the reader with no pinpad.
name = "cardb"
path = "src/cardb.rs"
required-features = ["development"]

[[bin]]
# THE MODEM GATE'S SCENARIO DRIVER, absent from a shipped image: it holds the modem fixture's control
# endpoint, which only a development image has.
name = "modemcheck"
path = "src/modemcheck.rs"
required-features = ["development"]

[[bin]]
# The modem gate's second data client: an inherited endpoint.
name = "modemhold"
path = "src/modemhold.rs"
required-features = ["development"]

[[bin]]
# The modem gate's data client that may replace an uplink.
name = "modemswap"
path = "src/modemswap.rs"
required-features = ["development"]

[[bin]]
# The modem gate's data-only client.
name = "modemdata"
path = "src/modemdata.rs"
required-features = ["development"]

[[bin]]
# The modem gate's launch that must fail after a grant was minted for it.
name = "modemfail"
path = "src/modemfail.rs"
required-features = ["development"]

[[bin]]
# THE CAMERA GATE'S SCENARIO DRIVER, absent from a shipped image: it holds the camera fixture's control
# endpoint, which only a development image has.
name = "camcheck"
path = "src/camcheck.rs"
required-features = ["development"]

[[bin]]
# The camera gate's second capture client.
name = "camhold"
path = "src/camhold.rs"
required-features = ["development"]

[[bin]]
# The camera gate's inventory-only client.
name = "camread"
path = "src/camread.rs"
required-features = ["development"]

[[bin]]
# The camera gate's launch that must fail after its capture grant was minted.
name = "camfail"
path = "src/camfail.rs"
required-features = ["development"]

[[bin]]
# THE MIDI GATE'S SCENARIO DRIVER, absent from a shipped image: it holds the MIDI fixture's control endpoint,
# which only a development image has.
name = "midicheck"
path = "src/midicheck.rs"
required-features = ["development"]

[[bin]]
# The MIDI gate's second receiver.
name = "midihold"
path = "src/midihold.rs"
required-features = ["development"]

[[bin]]
# The MIDI gate's inventory-only client.
name = "midiread"
path = "src/midiread.rs"
required-features = ["development"]

[[bin]]
# The MIDI gate's launch that must fail after its receiver was minted.
name = "midifail"
path = "src/midifail.rs"
required-features = ["development"]

[[bin]]
name = "time_service"
path = "src/time_service.rs"

[[bin]]
name = "audio_service"
path = "src/audio_service.rs"

[[bin]]
