[package]
name = "rt"
# The product version lives only in /product.conf; Cargo's optional package
# version is unused here and omitted. `rt` is the shared
# ring-3 userspace runtime linked into every userspace program (the entry stub,
# syscall wrapper, panic handler, and the syscall/IPC/volume helpers).
edition = "2024"
description = "Shared ring-3 userspace runtime: entry stub, syscall wrapper, panic handler, and the syscall/IPC/volume helpers"

[features]
default = []
shared-image = []
# THE HOST-TEST SEAM. A crate that links this runtime cannot run `cargo test` on the host: the
# panic handler and the global allocator collide with the std the test harness needs (E0152), and
# the entry stub and the allocation-error hook are symbols the host has its own definitions of. This
# feature drops those five and keeps everything else - the syscall wrappers, the ABI re-exports,
# the helpers - so a driver crate's PURE layers (ring validation, request validation) can be tested
# on the host through a fake-controller seam. It is enabled by a crate's `[dev-dependencies]` entry
# for this runtime and by nothing else: cargo unifies a dev-dependency's features into a test build
# and into no other build, so the shipped programs never see it.
host-tests = []

[dependencies]
# Shared kernel/userspace ABI constants (the single source of truth), re-exported
# so the programs reach syscall numbers, error codes, rights, and the archive
# format through this one runtime crate.
abi = { path = "../../../abi" }

# The bounded transferred-handle list (`wire::Handles`) that the serve loops pass between a
# message and a generated dispatch. `wire` has no dependencies of its own, so this adds no
# cycle, and every method on it is `#[inline]`, so it adds no runtime import either.
wire = { path = "../../../wire" }


# Note: the x86_64-unknown-none target is panic-strategy = "abort" by default, so
# we do not set `panic = "abort"` per-profile (same reasoning as the kernel).

# A WARNING IS AN ERROR HERE. A sweep took ninety-one `allow` attributes out of this tree and found
# a hundred and twenty warnings underneath them - a duplicate register read a driver was told to
# call, a field whose comment said it kept a DMA buffer alive and which nothing read, a HAL entry
# all three backends declared and none called. None of that was reported, because the reporting had
# been switched off file by file over years, unevenly, and nobody had decided it.
#
# `[lints]` rather than `RUSTFLAGS`: this denies in THIS package only. RUSTFLAGS would deny inside
# `build-std`'s `core` and `compiler_builtins` too, where a warning is not ours to answer.
[lints.rust]
warnings = "deny"
