[package]
name = "roles"
# The bootstrap roles of every managed service, generated from services/manifest.toml.
#
# A separate crate because BOTH ENDS READ IT: the supervisor that sends a service its capabilities
# and the service that receives them. A tag written by hand at each end is the shape of the defect
# that cost this tree a bisect over 170 tests - three programs read their bootstrap in an order the
# sender does not use, and a blocking tagged read consumed the message that was actually next.
edition = "2024"
build = "build.rs"
description = "Generated bootstrap-role plan, read by the sender and by every receiver"

[build-dependencies]
system-manifest = { path = "../../../tools/system-manifest" }

[dependencies]
