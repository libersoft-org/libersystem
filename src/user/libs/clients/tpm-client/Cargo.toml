[package]
# The product version lives only in /product.conf; Cargo's optional package version is unused here and
# omitted.
name = "tpm-client"
edition = "2024"
description = "Dynamic channel-client boundary for the LiberSystem TPM LSIDL domain"

[lib]
path = "src/lib.rs"

[features]
default = []
shared-image = []

[dependencies]
base-proto = { path = "../../protocol/base-proto" }
tpm-proto = { path = "../../protocol/tpm-proto" }

[lints.rust]
warnings = "deny"
