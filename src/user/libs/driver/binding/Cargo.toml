[package]
name = "driver-binding"
# The product version lives only in /product.conf; Cargo's optional package version is unused here
# and omitted.
edition = "2024"
description = "Where a device binding is, why it got there, and which transitions are legal"

[lib]
path = "src/lib.rs"

[dependencies]
driver-protocol = { path = "../protocol" }

# A WARNING IS AN ERROR HERE, as everywhere else in this tree.
[lints.rust]
warnings = "deny"
