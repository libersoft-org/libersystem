[package]
name = "drivers"
# The product version lives only in /product.conf; Cargo's optional package
# version is unused here and omitted. The drivers crate produces the userspace
# virtio drivers DeviceManager launches, one isolated process per device.
edition = "2024"
build = "../../build.rs"
description = "Userspace virtio drivers (blk, net, console, input)"

[[bin]]
# THE IN-GUEST BLUETOOTH FIXTURE: an emulated controller and the LE boot mouse on the far side of its
# radio, published as a `bluetooth-hci` provider. Development-only in the manifest, bound to a QEMU
# test device at a pinned address - a shipping machine has neither.
name = "bt_fixture"
path = "src/bt_fixture.rs"
test = false
bench = false
required-features = ["development"]

[[bin]]
# THE IN-GUEST POWER FIXTURE: a HID-shaped UPS and ACPI-shaped power sources from decoded data,
# published as two `power-source` providers, and the control endpoint the power gate's probe drives.
# Development-only in the manifest, bound to a QEMU test device at a pinned address.
name = "power_fixture"
path = "src/power_fixture.rs"
test = false
bench = false
required-features = ["development"]

[[bin]]
# THE IN-GUEST SMART-CARD FIXTURE: two readers and the PIV cards in them, published as
# `smartcard-reader` providers, and the control endpoint the smart-card gate's probe drives.
# Development-only in the manifest, bound to a QEMU test device at a pinned address.
name = "smartcard_fixture"
path = "src/smartcard_fixture.rs"
test = false
bench = false
required-features = ["development"]

[[bin]]
# THE IN-GUEST MODEM FIXTURE: a modem, its SIM and the network behind it, published as a `modem`
# provider over the staged MBIM validators, and the control endpoint the modem gate's probe drives.
# Development-only in the manifest, bound to a QEMU test device at a pinned address.
name = "modem_fixture"
path = "src/modem_fixture.rs"
test = false
bench = false
required-features = ["development"]

[[bin]]
# THE IN-GUEST CAMERA FIXTURE: a camera whose synthetic descriptors go through the staged UVC normalizer,
# writing deterministic frames into the buffers its consumer queued, and the control endpoint the camera
# gate's probe drives. Development-only in the manifest, bound to a QEMU test device at a pinned address.
name = "camera_fixture"
path = "src/camera_fixture.rs"
test = false
bench = false
required-features = ["development"]

[[bin]]
# THE IN-GUEST MIDI FIXTURE: a MIDI device with two receive endpoints delivering the packet batches the MIDI
# gate's probe scripts, and the control endpoint it drives. Development-only in the manifest, bound to a QEMU
# test device at a pinned address.
name = "midi_fixture"
path = "src/midi_fixture.rs"
test = false
bench = false
required-features = ["development"]

[[bin]]
# THE IN-GUEST ADMINISTRATIVE EXECUTOR: a bounded probe write over two target generations, published as an
# `admin-executor` provider, and the read-only witness the administrative-path gate counts effects through.
# Development-only in the manifest, bound to a QEMU test device at a pinned address.
name = "admin_fixture"
path = "src/admin_fixture.rs"
test = false
bench = false
required-features = ["development"]

[[bin]]
# The virtio-scsi driver. The SCSI command set it speaks is `src/scsi.rs`, which it extracted from
# the USB storage path and which that path now shares.
name = "virtio_scsi"
path = "src/virtio_scsi.rs"
test = false
bench = false

[[bin]]
# The virtio-vsock driver. Its packet header, credit window and connection state machine are
# `src/vsock.rs`, which is part of the library and host-tested; this binary is the transport.
name = "virtio_vsock"
path = "src/virtio_vsock.rs"
test = false
bench = false

[[bin]]
name = "virtio_blk"
path = "src/virtio_blk.rs"
test = false
bench = false

[[bin]]
# The Intel High Definition Audio controller driver. Its verb packing, ring arithmetic, graph walk
# and format word live in `src/hda.rs`, which is part of the library and host-tested.
name = "hda"
path = "src/hda_driver.rs"
test = false
bench = false

[[bin]]
# The SD/eMMC host controller driver. Its SD protocol core lives in `src/sdhci.rs`, which knows
# nothing about PCI so board glue can stay outside it; this binary is the attachment and the
# register access.
name = "sdhci"
path = "src/sdhci_driver.rs"
test = false
bench = false

[[bin]]
# The AHCI SATA host bus adapter driver. Its decisions live in `src/ahci.rs`, which is part of the
# library and host-tested; this binary is the MMIO, the DMA and the command issue.
name = "ahci"
path = "src/ahci_driver.rs"
test = false
bench = false

[[bin]]
# The NVM Express controller driver. Its decisions live in `src/nvme.rs`, which is part of the
# library and host-tested; this binary is the MMIO, the DMA and the waiting.
name = "nvme"
path = "src/nvme_driver.rs"
test = false
bench = false

[[bin]]
name = "virtio_net"
path = "src/virtio_net.rs"
test = false
bench = false

[[bin]]
name = "virtio_console"
path = "src/virtio_console.rs"
test = false
bench = false

[[bin]]
name = "dev_channel"
path = "src/dev_channel.rs"
test = false
bench = false
# The control port's transport, absent from a shipped image for the same reason the agent
# above it is.
required-features = ["development"]

[[bin]]
name = "virtio_rng"
path = "src/virtio_rng.rs"
test = false
bench = false

[[bin]]
name = "virtio_input"
path = "src/virtio_input.rs"
test = false
bench = false

[[bin]]
name = "virtio_gpu"
path = "src/virtio_gpu.rs"
test = false
bench = false

[[bin]]
name = "virtio_snd"
path = "src/virtio_snd.rs"
test = false
bench = false

[[bin]]
name = "xhci"
path = "src/xhci.rs"
test = false
bench = false

[features]
default = []
# The development control port's transport. Deliberately not in `default`.
development = []

[dependencies]
# Shared ring-3 userspace runtime (entry stub, syscall wrapper, panic handler, and
# the syscall/IPC helpers); it re-exports the abi constants.
rt = { path = "../../runtime/rt" }
# THE BRING-UP WIRE. One frame format shared with DeviceManager, so the two cannot drift: the note a
# driver carries and the `version` on every frame it sends come from the same constant.
driver-protocol = { path = "../../libs/driver/protocol" }
# The bounded transferred-handle list the capability-aware receive answers with. The ordinary
# receive takes the first and drops the rest, which is silent loss on a path this protocol treats as
# hostile input.
wire = { path = "../../../wire" }

# The generated liber:system bindings - the xHCI driver serves the typed `usb`
# inventory contract on its query channel.
proto = { path = "../../../proto" }

# The channel transport the generated SystemPower client calls over: the two keyboard drivers ask
# SystemManager to stop the machine instead of holding the capability that would let them do it.
ipc-client = { path = "../../libs/ipc/ipc-client" }

# THE TYPED DISPLAY-DEVICE WIRE, which the virtio-gpu driver SERVES. A separate package from the
# application-facing display one: a driver's contract and an application's are two things, and one
# package carrying both would make every application link the driver's wire.
display-device-proto = { path = "../../libs/protocol/display-device-proto" }

# THE CANONICAL POWER MODEL. A power producer - the in-guest fixture now, the HID Power Device and
# ACPI drivers when they land - builds every record it publishes with these adapters, so the unit
# arithmetic exists once and PowerService only has to check it was used.
power-model = { path = "../../libs/power/model" }
# THE ANSWER-TO-RESET PARSER, shared by every reader provider and SmartcardService. The in-guest fixture
# checks the ATR it plays is one a real parser accepts; the USB CCID class module parses cards with it.
smartcard-model = { path = "../../libs/smartcard/model" }
# SHA-256, for the digest an administrative executor takes of the payload it copied at preparation - the
# digest a person confirms. The same implementation the boot chain verifies images with.
bootproto = { path = "../../../boot/protocol" }


# THE HOST-TEST SEAM. The library's PURE layers - ring validation, block request validation - are
# tested on the host; the runtime they link is built with its `host-tests` feature for the test
# build alone (cargo unifies a dev-dependency's features into `cargo test` and into nothing else),
# which drops the entry stub, the panic handler and the allocator that would otherwise collide with
# the std the harness needs. The bins declare `test = false` above: they are `no_std` programs with
# no harness of their own, and `cargo test --manifest-path src/user/drivers/core/Cargo.toml` from
# the repository root - the host target - runs the library's suite and nothing else.
[dev-dependencies]
rt = { path = "../../runtime/rt", features = ["host-tests"] }

# Note: the x86_64-unknown-none target is panic-strategy = "abort" by default, so
# we do not set `panic = "abort"` per-profile (same reasoning as the kernel).

# A WARNING IS AN ERROR HERE. A sweep took ninety-one `allow` attributes out of this tree and found
# a hundred and twenty warnings underneath them - a duplicate register read a driver was told to
# call, a field whose comment said it kept a DMA buffer alive and which nothing read, a HAL entry
# all three backends declared and none called. None of that was reported, because the reporting had
# been switched off file by file over years, unevenly, and nobody had decided it.
#
# `[lints]` rather than `RUSTFLAGS`: this denies in THIS package only. RUSTFLAGS would deny inside
# `build-std`'s `core` and `compiler_builtins` too, where a warning is not ours to answer.
[lints.rust]
warnings = "deny"
