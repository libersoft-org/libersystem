[package]
name = "drivers"
# The product version lives only in /product.conf; Cargo's optional package
# version is unused here and omitted. The drivers crate produces the userspace
# virtio drivers DeviceManager launches, one isolated process per device.
edition = "2024"
build = "../../build.rs"
description = "Userspace virtio drivers (blk, net, console, input)"

[[bin]]
# THE IN-GUEST BLUETOOTH FIXTURE: an emulated controller and the LE boot mouse on the far side of its
# radio, published as a `bluetooth-hci` provider. Development-only in the manifest, bound to a QEMU
# test device at a pinned address - a shipping machine has neither.
name = "bt_fixture"
path = "src/bt_fixture.rs"
test = false
bench = false
required-features = ["development"]

[[bin]]
# THE SLEEP GATE'S FIXTURE: an `ivshmem-plain` function hot-plugged into the empty native hot-plug port, whose `SUSPEND` is
# held or refused as the harness writes into its shared memory. Development-only, bound by address - a shipping machine
# has neither the program nor the device.
name = "sleep_fixture"
path = "src/sleep_fixture.rs"
test = false
bench = false
required-features = ["development"]

[[bin]]
# THE IN-GUEST POWER FIXTURE: a HID-shaped UPS and ACPI-shaped power sources from decoded data,
# published as two `power-source` providers, and the control endpoint the power gate's probe drives.
# Development-only in the manifest, bound to a QEMU test device at a pinned address.
name = "power_fixture"
path = "src/power_fixture.rs"
test = false
bench = false
required-features = ["development"]

[[bin]]
# THE IN-GUEST SMART-CARD FIXTURE: two readers and the PIV cards in them, published as
# `smartcard-reader` providers, and the control endpoint the smart-card gate's probe drives.
# Development-only in the manifest, bound to a QEMU test device at a pinned address.
name = "smartcard_fixture"
path = "src/smartcard_fixture.rs"
test = false
bench = false
required-features = ["development"]

[[bin]]
# THE IN-GUEST MODEM FIXTURE: a modem, its SIM and the network behind it, published as a `modem`
# provider over the staged MBIM validators, and the control endpoint the modem gate's probe drives.
# Development-only in the manifest, bound to a QEMU test device at a pinned address.
name = "modem_fixture"
path = "src/modem_fixture.rs"
test = false
bench = false
required-features = ["development"]

[[bin]]
# THE IN-GUEST CAMERA FIXTURE: a camera whose synthetic descriptors go through the staged UVC normalizer,
# writing deterministic frames into the buffers its consumer queued, and the control endpoint the camera
# gate's probe drives. Development-only in the manifest, bound to a QEMU test device at a pinned address.
name = "camera_fixture"
path = "src/camera_fixture.rs"
test = false
bench = false
required-features = ["development"]

[[bin]]
# THE IN-GUEST MIDI FIXTURE: a MIDI device with two receive endpoints delivering the packet batches the MIDI
# gate's probe scripts, and the control endpoint it drives. Development-only in the manifest, bound to a QEMU
# test device at a pinned address.
name = "midi_fixture"
path = "src/midi_fixture.rs"
test = false
bench = false
required-features = ["development"]

[[bin]]
# THE IN-GUEST GAMEPAD FIXTURE: gamepads of the harness's shape published over the production `gamepad` wire,
# and the control endpoint the gamepad tool's gate drives. Development-only in the manifest, bound to a QEMU
# test device at a pinned address.
name = "gamepad_fixture"
path = "src/gamepad_fixture.rs"
test = false
bench = false
required-features = ["development"]

[[bin]]
# THE IN-GUEST ADMINISTRATIVE EXECUTOR: a bounded probe write over two target generations, published as an
# `admin-executor` provider, and the read-only witness the administrative-path gate counts effects through.
# Development-only in the manifest, bound to a QEMU test device at a pinned address.
name = "admin_fixture"
path = "src/admin_fixture.rs"
test = false
bench = false
required-features = ["development"]

# THE ACPI GATE'S FIXTURE DRIVER, bound to the fixture SSDT's `LSFX0001` node in a development image alone.
[[bin]]
name = "acpi_fixture"
path = "src/acpi_fixture.rs"
test = false
bench = false
required-features = ["development"]

[[bin]]
# The virtio-scsi driver. The SCSI command set it speaks is `src/scsi.rs`, which it extracted from
