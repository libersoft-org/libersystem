[package]
name = "drivers"
# The product version lives only in /product.conf; Cargo's optional package
# version is unused here and omitted. The drivers crate produces the userspace
# virtio drivers DeviceManager launches, one isolated process per device.
edition = "2024"
build = "../../build.rs"
description = "Userspace virtio drivers (blk, net, console, input)"

[[bin]]
name = "virtio_blk"
path = "src/virtio_blk.rs"

[[bin]]
name = "virtio_net"
path = "src/virtio_net.rs"

[[bin]]
name = "virtio_console"
path = "src/virtio_console.rs"

[[bin]]
name = "dev_channel"
path = "src/dev_channel.rs"
# The control port's transport, absent from a shipped image for the same reason the agent
# above it is.
required-features = ["development"]

[[bin]]
name = "virtio_input"
path = "src/virtio_input.rs"

[[bin]]
name = "virtio_gpu"
path = "src/virtio_gpu.rs"

[[bin]]
name = "virtio_snd"
path = "src/virtio_snd.rs"

[[bin]]
name = "xhci"
path = "src/xhci.rs"

[features]
default = []
# The development control port's transport. Deliberately not in `default`.
development = []

[dependencies]
# Shared ring-3 userspace runtime (entry stub, syscall wrapper, panic handler, and
# the syscall/IPC helpers); it re-exports the abi constants.
rt = { path = "../../runtime/rt" }

# The generated liber:system bindings - the xHCI driver serves the typed `usb`
# inventory contract on its query channel.
proto = { path = "../../../proto" }

# The channel transport the generated SystemPower client calls over: the two keyboard drivers ask
# SystemManager to stop the machine instead of holding the capability that would let them do it.
ipc-client = { path = "../../libs/ipc/ipc-client" }


# Note: the x86_64-unknown-none target is panic-strategy = "abort" by default, so
# we do not set `panic = "abort"` per-profile (same reasoning as the kernel).

# A WARNING IS AN ERROR HERE. P02M0144 took ninety-one `allow` attributes out of this tree and found
# a hundred and twenty warnings underneath them - a duplicate register read a driver was told to
# call, a field whose comment said it kept a DMA buffer alive and which nothing read, a HAL entry
# all three backends declared and none called. None of that was reported, because the reporting had
# been switched off file by file over years, unevenly, and nobody had decided it.
#
# `[lints]` rather than `RUSTFLAGS`: this denies in THIS package only. RUSTFLAGS would deny inside
# `build-std`'s `core` and `compiler_builtins` too, where a warning is not ours to answer.
[lints.rust]
warnings = "deny"
