[[bin]]
name = "virtio_rng"
path = "src/virtio_rng.rs"
test = false
bench = false

[[bin]]
name = "virtio_input"
path = "src/virtio_input.rs"
test = false
bench = false

[[bin]]
name = "virtio_gpu"
path = "src/virtio_gpu.rs"
test = false
bench = false

[[bin]]
name = "virtio_snd"
path = "src/virtio_snd.rs"
test = false
bench = false

[[bin]]
# The virtio-i2c controller driver. Its request building is `src/i2c.rs` and the SMBus transactions it
# composes are `src/smbus.rs`, both part of the library and host-tested; this binary is the queue and the
# address-scoped connections.
name = "virtio_i2c"
path = "src/virtio_i2c.rs"
test = false
bench = false

[[bin]]
# The virtio-gpio controller driver. Each line's one-event cycle is `src/gpio.rs`, part of the library and
# host-tested; this binary is the two queues and the line-scoped connections.
name = "virtio_gpio"
path = "src/virtio_gpio.rs"
test = false
bench = false

[[bin]]
# THE TPM 2.0 DRIVER: the platform device the firmware describes - the `TPM2` table's on x86_64, a
# `tcg,tpm-tis-mmio` node on the device-tree ports - driven over its FIFO or CRB interface by `src/tpm`, and
# published as the one `tpm` provider TpmService consumes.
name = "tpm_driver"
path = "src/tpm_driver.rs"
test = false
bench = false

[[bin]]
# THE ACPI BATTERY, AC ADAPTER AND THERMAL ZONE: one binding per namespace node, its methods read over the node channel
# and published as a `power-source`. Its pure parts are `src/acpi_power.rs`, in the library and host-tested.
name = "acpi_power"
path = "src/acpi_power_driver.rs"
test = false
bench = false

[[bin]]
# THE ACPI FAN: one binding per `PNP0C0B` node, `_FIF`, `_FPS`, `_FSL` and `_FST` - or its device power state for an ACPI
# 1.0 fan - over the node channel, published as a `cooling-device` to ProcessorPowerService. Its pure parts are
# `src/acpi_fan.rs`, in the library and host-tested.
name = "acpi_fan"
path = "src/acpi_fan_driver.rs"
test = false
bench = false

[[bin]]
# THE ACPI VIDEO BACKLIGHT: one binding per panel output node (the `video-output` class), `_BCL`, `_BCM`, `_BQC` and the
# adapter's `_DOS` over the node channel, published as a `backlight` to DisplayService. Its pure parts are
# `src/acpi_video.rs`, in the library and host-tested.
name = "acpi_backlight"
path = "src/acpi_backlight_driver.rs"
test = false
bench = false

[[bin]]
# THE ACPI AMBIENT-LIGHT SENSOR: one binding per `ACPI0008` node, `_ALI`, `_ALR` and `_ALP` over the node channel,
# published as an `ambient-light` to the brightness policy. Its pure parts are in `src/acpi_video.rs` too.
name = "acpi_als"
path = "src/acpi_als_driver.rs"
test = false
bench = false

[[bin]]
# THE ACPI BUTTONS AND THE LID: a control-method power or sleep button carries out its press as the fixed one does, and a
# lid publishes a `platform-switch`. Its pure parts are `src/acpi_button.rs`, in the library and host-tested.
name = "acpi_button"
path = "src/acpi_button_driver.rs"
test = false
bench = false

[[bin]]
# THE ACPI TIME AND ALARM DEVICE: its clock handed to the kernel where the kernel reads no RTC of its own, and its wake
# timers set from a sleep's timed wake. Its pure parts are `src/acpi_tad.rs`, in the library and host-tested.
name = "acpi_tad"
path = "src/acpi_tad_driver.rs"
test = false
bench = false

[[bin]]
# HID OVER I2C: a touchpad or touchscreen on another driver's bus, bound as a child through the address and the
# interrupt line DeviceManager scoped on its controllers. Its pure parts are `src/i2c_hid.rs`, in the library and
# host-tested.
name = "i2c_hid"
path = "src/i2c_hid_driver.rs"
test = false
bench = false

[[bin]]
# THE KERNEL CONSOLE'S UART: the kernel-declared COM1 row, whose claim takes the console from the kernel -
# its ports, its IRQ 4 and the kernel's console tap - published as `ConsoleBytes` under the kernel console's
# name. The 16550 register engine is `src/uart.rs`, in the library and host-tested.
name = "uart16550"
path = "src/uart16550.rs"
test = false
bench = false

[[bin]]
# THE KERNEL CONSOLE'S UART ON THE DEVICE-TREE PORTS: the PL011 on aarch64 and the 16550 in a register window on riscv64,
# the platform row the tree names as its console, whose claim takes the console from the kernel - its window, its line
# and the kernel's console tap - published as `ConsoleBytes` under the kernel console's name. The serving rules are
# `src/console_uart.rs` and the engines `src/pl011.rs` and `src/uart.rs`, in the library and host-tested.
name = "console_uart"
path = "src/console_uart_driver.rs"
test = false
bench = false

[[bin]]
# THE HARDWARE WATCHDOGS, each a `watchdog` provider published under its device's name: the Intel 6300ESB on the
