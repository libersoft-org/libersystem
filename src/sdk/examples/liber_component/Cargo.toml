[package]
name = "liber_component"
# The product version lives only in /product.conf; Cargo's optional package version is unused here
# and omitted. This crate is the SDK's EXAMPLE: a guest built for wasm32-unknown-unknown against the
# `liber:vfs@1` / `liber:log@1` world and run on the kernel's component host (see
# src/user/services/core/src/component_host.rs).
edition = "2024"
description = "LiberSystem component SDK example: a Rust guest built against the liber world"

[lib]
# A cdylib so the toolchain emits a WebAssembly module (imports + exports), not a host archive. The
# build recipe compiles it for wasm32-unknown-unknown and the package builder stages it directly
# from the repository build root.
crate-type = ["cdylib", "rlib"]

[dependencies]
liber-sdk = { path = "../.." }

# A WARNING IS AN ERROR HERE. A sweep took ninety-one `allow` attributes out of this tree and found
# a hundred and twenty warnings underneath them - a duplicate register read a driver was told to
# call, a field whose comment said it kept a DMA buffer alive and which nothing read, a HAL entry
# all three backends declared and none called. None of that was reported, because the reporting had
# been switched off file by file over years, unevenly, and nobody had decided it.
#
# `[lints]` rather than `RUSTFLAGS`: this denies in THIS package only. RUSTFLAGS would deny inside
# `build-std`'s `core` and `compiler_builtins` too, where a warning is not ours to answer.
[lints.rust]
warnings = "deny"
