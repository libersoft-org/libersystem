# Pinned external verification artifacts.
#
# WHAT THIS FILE IS FOR: a tool that a gate depends on and that this repository does not build must
# be pinned by CONTENT, not by name. A version number names what a mirror is supposed to serve; a
# SHA-256 names what it actually served, and a gate that verifies the second cannot be moved by
# anybody who can move the first.
#
# The verification gates themselves are NETWORK-DISABLED. They read the cache and, when the artifact
# is absent, print the one bootstrap command that fetches it - so a clean checkout is honest about
# needing one step rather than pretending to be self-contained.
#
# Format: one artifact per block. `sha256` is over the file exactly as fetched.

[tla2tools]
purpose = "TLC, the TLA+ model checker: the capability transfer model's gate"
version = "1.7.4"
url = "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
sha256 = "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"
cache = ".build/tools/tla2tools.jar"
# The JAR is bytecode: the Java that runs it is the other half of the pin. Measured on the machine
# this was developed on; TLC 1.7.4 requires 11 or later, and a newer major is accepted rather than
# demanded because a model checker's answer does not depend on which one ran it.
java_min_major = 11
java_measured = "25.0.4.1"

# ------------------------------------------------------------------ the Unicode Character Database
#
# THE TABLES ARE GENERATED FROM THESE AND NOT WRITTEN BY HAND, which is what the text milestone
# requires and what a hand-written range list cannot be: a property table copied out of a document is
# a snapshot nobody can re-derive, and the first correction to it is a patch rather than a
# regeneration. `src/tools/ucd-gen` reads the files below out of the cache and writes
# `user/libs/text/unicode-tables/src/generated.rs`; the gate regenerates and compares.
#
# THE VERSION IS PART OF THE PIN. Segmentation changes between Unicode versions - a break that moves
# is a boundary a user sees move - so the tables state which version they came from and every file
# here is from that one release. Mixing two releases is the failure this block exists to prevent.
#
# LICENCE: the UCD is published under the Unicode License v3, which is permissive in the sense
# `docs/DEPENDENCY_POLICY.md` requires: use, modification and redistribution in source and binary
# form, with the notice kept. The GENERATED tables carry that notice and name the version they came
# from; the files themselves are fetched rather than vendored, which is what the cache is for.

[ucd_grapheme_break]
