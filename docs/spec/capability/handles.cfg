\* THE HANDLE HALF, with the lever that the spike deliberately leaves down: the minted capability
\* carries DUPLICATE here, so `HandleTable::duplicate` is reachable and the rights algebra is
\* exercised rather than merely defined.
\*
\* WHAT IS NOT CHECKED HERE, AND WHY: `TransferIsLinear` counts one authority in one place, which is
\* exact only while nothing duplicates. Two capabilities for one object are two owners and not a
\* violation, and a configuration that kept the invariant while enabling duplication would be one
\* whose name no longer described what it checks. Splitting them is M3's rule; weakening the
\* invariant invisibly is what it refuses.
CONSTANTS
    Procs = {p1, p2}
    Objects = {o1}
    Types = {t1, t2}
    Slots = 2
    QueueLimit = 1
    MaxGen = 2
    MaxId = 2
    MintedRights = {"USE", "DUPLICATE", "TRANSFER"}
    \* Keep everything, and narrow to one. The middle cases are the same two rules.
    RevocationModeled = FALSE
    BatchMax = 1
    DerivedRights = {{"USE", "DUPLICATE", "TRANSFER"}, {"USE"}}

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AuthorityNeverWidens
    NoForgery
    QuotaConserved
    QueueBounded
    SlotOwnershipUnique
    PostCommitCopyoutIsTerminal
    ClosedProcessCannotResurrect
    StaleHandlesStayDead
    ReceiveIsTransactional
    MessageIdentityStable
    TypeSealing
    FailedSendRestores
    RevokedSnapshotCannotOperate

PROPERTIES
    GenerationsOnlyAdvance
