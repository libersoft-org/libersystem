\* THE BATCH, AND IT IS THE ONLY LEVER MOVED. `BatchMax = 2` is the smallest configuration in which
\* "a refused send returns ALL of them" is a different sentence from "a refused send returns it": one
\* capability cannot show an all-or-nothing rule.
\*
\* Two objects, because a batch of one object twice is a batch a duplicate-source check refuses -
\* and `Take` refusing the same slot twice is the rule this configuration is here to exercise.
\*
\* `TransferIsLinear` counts one authority in one place and is checked here: nothing duplicates in
\* this configuration, so two capabilities are two objects rather than two copies of one.
CONSTANTS
    Procs = {p1, p2}
    Objects = {o1}
    Types = {t1}
    Slots = 3
    QueueLimit = 1
    MaxGen = 2
    MaxId = 2
    MintedRights = {"USE", "TRANSFER"}
    RevocationModeled = FALSE
    CoversModeled = TRUE
    BatchMax = 2
    DerivedRights = {}

SPECIFICATION Spec

INVARIANTS
    TypeOK
    TransferIsLinear
    AuthorityNeverWidens
    NoForgery
    QuotaConserved
    QueueBounded
    SlotOwnershipUnique
    PostCommitCopyoutIsTerminal
    ClosedProcessCannotResurrect
    StaleHandlesStayDead
    ReceiveIsTransactional
    MessageIdentityStable
    TypeSealing
    RevokedSnapshotCannotOperate
    FailedSendRestores

PROPERTIES
    GenerationsOnlyAdvance
