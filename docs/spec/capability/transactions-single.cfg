\* THE SINGLE-CAPABILITY FAULT PHASES, with room in the queue for the reservation to be visible.
\*
\* The spike is the same shape with a queue that holds ONE message, which makes "the message is off
\* the queue and still holding its slot" and "the queue is full" the same state. Two makes them
\* different, and the depth a receive can be interrupted at is what this configuration is for: the
\* payload copy failing before the commit, the handle-number copyout failing after it, and a
\* termination arriving at either.
\*
\* TWO OBJECTS, SO THE ROOM IN THE QUEUE IS ROOM FOR SOMETHING. `QueueLimit = 2` said the endpoint
\* would hold two messages and one object meant only one message could ever carry a capability - so
\* the second slot was a number, the queue never held two, and every invariant that quantifies over
\* queued messages was quantifying over one whatever it said. Two single-capability sends is exactly
\* the two-message queue this configuration's own first paragraph is about. `BatchMax` stays 1: the
\* subject here is one capability per message, and the batch is `transactions-batch`'s.
CONSTANTS
    Procs = {p1, p2}
    Objects = {o1, o2}
    Types = {t1}
    Slots = 3
    QueueLimit = 2
    MaxGen = 2
    MaxId = 3
    MintedRights = {"USE", "TRANSFER"}
    RevocationModeled = FALSE
    CoversModeled = TRUE
    BatchMax = 1
    DerivedRights = {}

SPECIFICATION Spec

INVARIANTS
    TypeOK
    TransferIsLinear
    AuthorityNeverWidens
    NoForgery
    QuotaConserved
    QueueBounded
    SlotOwnershipUnique
    PostCommitCopyoutIsTerminal
    ClosedProcessCannotResurrect
    StaleHandlesStayDead
    ReceiveIsTransactional
    MessageIdentityStable
    TypeSealing
    RevokedSnapshotCannotOperate
    FailedSendRestores

PROPERTIES
    GenerationsOnlyAdvance
