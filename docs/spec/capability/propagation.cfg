\* THREE PROCESSES, SO A CAPABILITY CAN BE PASSED ALONG RATHER THAN JUST ACROSS.
\*
\* A chain is what makes attenuation a property rather than a rule about one step: the third process
\* may hold no more than the second gave it, which may be no more than the first had. Duplication is
\* enabled - narrowing to `USE` alone is the only derivation offered - because attenuation without a
\* way to narrow is a sentence with no verb.
\*
\* `TransferIsLinear` is NOT checked here, for the reason `handles.cfg` gives: it counts one
\* authority in one place, which duplication makes false by design. `AuthorityNeverWidens` and
\* `NoForgery` are what carry the claim in this configuration.
CONSTANTS
    Procs = {p1, p2, p3}
    Objects = {o1}
    Types = {t1}
    Slots = 2
    QueueLimit = 1
    MaxGen = 2
    MaxId = 2
    MintedRights = {"USE", "DUPLICATE", "TRANSFER"}
    RevocationModeled = FALSE
    BatchMax = 1
    DerivedRights = {{"USE"}}

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AuthorityNeverWidens
    NoForgery
    QuotaConserved
    QueueBounded
    SlotOwnershipUnique
    PostCommitCopyoutIsTerminal
    ClosedProcessCannotResurrect
    StaleHandlesStayDead
    ReceiveIsTransactional
    MessageIdentityStable
    TypeSealing
    RevokedSnapshotCannotOperate
    FailedSendRestores

PROPERTIES
    GenerationsOnlyAdvance
