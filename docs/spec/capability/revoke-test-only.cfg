\* THE TEST-ONLY REVOCATION CONFIGURATION, and the label is the point.
\*
\* `ObjectHeader::revoke` exists in this tree as a TEST HELPER. The production authority model has
\* stale handles after slot reuse and object destruction and NO syscall that globally invalidates
\* derived capabilities - so a result from this configuration describes what the helper does, and may
\* not be cited for the production claim. The other configurations run with `RevocationModeled` false,
\* which removes the action entirely rather than leaving it disabled by a guard.
CONSTANTS
    Procs = {p1, p2}
    Objects = {o1}
    Types = {t1}
    Slots = 2
    QueueLimit = 1
    MaxGen = 2
    MaxId = 2
    MintedRights = {"USE", "TRANSFER"}
    RevocationModeled = TRUE
    BatchMax = 1
    DerivedRights = {}

SPECIFICATION Spec

INVARIANTS
    TypeOK
    TransferIsLinear
    AuthorityNeverWidens
    NoForgery
    QuotaConserved
    QueueBounded
    SlotOwnershipUnique
    PostCommitCopyoutIsTerminal
    ClosedProcessCannotResurrect
    StaleHandlesStayDead
    ReceiveIsTransactional
    MessageIdentityStable
    TypeSealing
    FailedSendRestores
    RevokedSnapshotCannotOperate

PROPERTIES
    GenerationsOnlyAdvance
