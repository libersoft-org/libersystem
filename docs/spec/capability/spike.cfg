\* THE SPIKE, and it is deliberately the smallest configuration that can still show the
\* interleaving this milestone exists for: a transfer racing a close.
\*
\* Two processes, one transferable object, two slots each, a queue that holds one message, and a
\* generation ceiling low enough that RETIREMENT is reachable inside the search rather than being a
\* branch no state ever takes.
CONSTANTS
    Procs = {p1, p2}
    Objects = {o1}
    Types = {t1}
    Slots = 2
    QueueLimit = 1
    MaxGen = 2
    MaxId = 2
    MintedRights = {"USE", "TRANSFER"}
    RevocationModeled = FALSE
    BatchMax = 1
    DerivedRights = {}

SPECIFICATION Spec

INVARIANTS
    TypeOK
    TransferIsLinear
    AuthorityNeverWidens
    NoForgery
    QuotaConserved
    QueueBounded
    SlotOwnershipUnique
    PostCommitCopyoutIsTerminal
    ClosedProcessCannotResurrect
    StaleHandlesStayDead
    ReceiveIsTransactional
    MessageIdentityStable
    TypeSealing
    FailedSendRestores
    RevokedSnapshotCannotOperate

PROPERTIES
    GenerationsOnlyAdvance
